name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Desired-state catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate schemas and relational invariants
        run: |
          python3 tools/validate_catalog.py
          python3 -m unittest discover -s tests -v

  manifests:
    name: Terraform and Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.35.5
      - name: Check shell syntax
        run: bash -n hack/*.sh
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Validate Terraform roots
        run: make validate
      - name: Render first-party chart and Kustomize layers
        run: |
          make helm-template
          make kustomize-build
      - name: Render pinned third-party Helm releases
        run: make helm-releases
