name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Desired-state catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate schemas and relational invariants
        run: |
          python3 tools/validate_catalog.py
          python3 -m unittest discover -s tests -v

  manifests:
    name: Terraform and Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.5
      - name: Check shell syntax
        run: bash -n hack/*.sh
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Validate Terraform roots
        run: make validate
      - name: Render first-party chart and Kustomize layers
        run: |
          make helm-template
          make kustomize-build
      - name: Render pinned third-party Helm releases
        run: make helm-releases

  container-contracts:
    name: Container runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify pinned image identities
        run: make container-contracts

  portal:
    name: Portal build and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: control-plane/portal/package-lock.json
      - name: Install portal dependencies
        run: npm --prefix control-plane/portal ci --ignore-scripts --no-audit --no-fund
      - name: Audit the complete portal dependency graph
        run: npm --prefix control-plane/portal audit
      - name: Build and verify portal contracts
        run: make portal-check
