name: Container image security evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.sh"
      - "Dockerfile*"
      - "**/Dockerfile*"
      - requirements-dev.txt
      - tools/compare_image_inventories.py
      - tools/aggregate_image_scan_decisions.py
      - tools/discover_container_images.py
      - tools/evaluate_image_scan.py
      - tools/verify_image_scan_evidence.py
      - tools/verify_image_sbom.py
      - tools/verify_container_contracts.py
      - schemas/image-vulnerability-exceptions.schema.json
      - security/image-vulnerability-exceptions/**
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.sh"
      - "Dockerfile*"
      - "**/Dockerfile*"
      - requirements-dev.txt
      - tools/compare_image_inventories.py
      - tools/aggregate_image_scan_decisions.py
      - tools/discover_container_images.py
      - tools/evaluate_image_scan.py
      - tools/verify_image_scan_evidence.py
      - tools/verify_image_sbom.py
      - tools/verify_container_contracts.py
      - schemas/image-vulnerability-exceptions.schema.json
      - security/image-vulnerability-exceptions/**

permissions:
  contents: read

concurrency:
  group: image-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Discover exact image subjects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      scan_required: ${{ steps.decision.outputs.scan_required }}
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install inventory dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build inventory and report coverage gaps
        id: inventory
        shell: bash
        run: |
          python3 tools/discover_container_images.py --format json > image-inventory.json
          python3 tools/discover_container_images.py --format markdown >> "$GITHUB_STEP_SUMMARY"
          matrix="$(python3 tools/discover_container_images.py --format github-matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Decide whether exact subjects require a fresh scan
        id: decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf 'scan_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'decision=full scan required for %s\n' "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          critical_changes="$(git diff --name-only "$BASE_SHA"...HEAD -- \
            .github/workflows/image-security.yaml \
            requirements-dev.txt \
            tools/aggregate_image_scan_decisions.py \
            tools/compare_image_inventories.py \
            tools/discover_container_images.py \
            tools/evaluate_image_scan.py \
            tools/verify_container_contracts.py \
            tools/verify_image_scan_evidence.py \
            tools/verify_image_sbom.py \
            schemas/image-vulnerability-exceptions.schema.json \
            security/image-vulnerability-exceptions)"
          if [[ -n "$critical_changes" ]]; then
            printf 'scan_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'decision=image evidence tooling changed\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_dir="$(mktemp -d)"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          python3 "$base_dir/tools/discover_container_images.py" --format json \
            > base-image-inventory.json
          python3 tools/compare_image_inventories.py \
            --base base-image-inventory.json \
            --current image-inventory.json \
            --format github-output >> "$GITHUB_OUTPUT"
      - name: Retain exact subjects and explicit gaps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-image-inventory
          path: image-inventory.json
          if-no-files-found: error
          retention-days: 14

  scan:
    name: Scan ${{ matrix.id }}
    needs: inventory
    if: needs.inventory.outputs.scan_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - name: Check out evidence verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan exact digest with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          version: v0.73.0
          format: json
          output: trivy-results.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          timeout: 20m
      - name: Record scanner and vulnerability-database identity
        run: trivy version --cache-dir .cache/trivy --format json > trivy-version.json
      - name: Verify and record exact scan subject
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_REF: ${{ matrix.image }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python3 tools/verify_image_scan_evidence.py \
            --image-id "$IMAGE_ID" \
            --expected-image "$IMAGE_REF" \
            --report trivy-results.json \
            --scanner-version trivy-version.json \
            --output scan-subject.json \
            --source-sha "$SOURCE_SHA" \
            --checkout-sha "$CHECKOUT_SHA" \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --event "$WORKFLOW_EVENT"
          printf 'Scanned exact subject `%s`. Findings are evidence, not yet a promotion gate.\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate Critical and High evidence
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_REF: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/evaluate_image_scan.py \
            --expected-image "$IMAGE_REF" \
            --report trivy-results.json \
            --scan-subject scan-subject.json \
            --exceptions "security/image-vulnerability-exceptions/${IMAGE_ID}.json" \
            --evaluated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output image-scan-decision.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("image-scan-decision.json").read_text())
          counts = result["counts"]
          print(
              "Critical: "
              f"{counts['critical']['available']} fix available, "
              f"{counts['critical']['unavailable']} no fix available."
          )
          print(
              "High: "
              f"{counts['high']['available']} fix available, "
              f"{counts['high']['unavailable']} no fix available."
          )
          print(
              "Decision: "
              f"{result['decision']['outcome']} (evidence only; not a promotion gate)."
          )
          PY
      - name: Generate and bind a CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          trivy convert \
            --format cyclonedx \
            --output image-sbom.cdx.json \
            trivy-results.json
          python3 tools/verify_image_sbom.py \
            --sbom image-sbom.cdx.json \
            --scan-subject scan-subject.json \
            --output sbom-subject.json
          printf 'Generated a verified CycloneDX SBOM for the exact scan subject.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain scanner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-${{ matrix.id }}
          path: |
            scan-subject.json
            image-scan-decision.json
            image-sbom.cdx.json
            sbom-subject.json
            trivy-results.json
            trivy-version.json
          if-no-files-found: error
          retention-days: 14

  evidence-decision:
    name: Container image evidence decision
    if: always()
    needs: [inventory, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.aggregate.outputs.available }}
      exact_subjects: ${{ steps.aggregate.outputs.exact_subjects }}
      scanned_subjects: ${{ steps.aggregate.outputs.scanned_subjects }}
      sbom_subjects: ${{ steps.aggregate.outputs.sbom_subjects }}
      coverage_gaps: ${{ steps.aggregate.outputs.coverage_gaps }}
      critical_total: ${{ steps.aggregate.outputs.critical_total }}
      critical_available: ${{ steps.aggregate.outputs.critical_available }}
      high_total: ${{ steps.aggregate.outputs.high_total }}
      high_available: ${{ steps.aggregate.outputs.high_available }}
    steps:
      - name: Check out evidence aggregator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify scan or reuse result
        env:
          DECISION: ${{ needs.inventory.outputs.decision }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SCAN_REQUIRED: ${{ needs.inventory.outputs.scan_required }}
          SCAN_RESULT: ${{ needs.scan.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INVENTORY_RESULT" == "success" ]]
          if [[ "$SCAN_REQUIRED" == "true" ]]; then
            [[ "$SCAN_RESULT" == "success" ]]
            printf 'Fresh Trivy evidence was produced for every exact subject.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$SCAN_RESULT" == "skipped" ]]
            printf 'No new Trivy scan ran: %s. Existing evidence applies only to the unchanged exact digests.\n' "$DECISION" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the exact discovered inventory
        if: needs.inventory.outputs.scan_required == 'true' && needs.scan.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: container-image-inventory
          path: container-image-inventory
      - name: Download per-image decisions
        if: needs.inventory.outputs.scan_required == 'true' && needs.scan.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: image-scan-*
          path: image-scan-decisions
      - name: Aggregate public-safe finding counts
        id: aggregate
        if: needs.inventory.outputs.scan_required == 'true' && needs.scan.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/aggregate_image_scan_decisions.py \
            --inventory container-image-inventory/image-inventory.json \
            --root image-scan-decisions \
            --output image-scan-summary.json \
            --github-output "$GITHUB_OUTPUT"
          cat image-scan-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain aggregate evidence
        if: needs.inventory.outputs.scan_required == 'true' && needs.scan.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-scan-summary
          path: image-scan-summary.json
          if-no-files-found: error
          retention-days: 14

  public-finding-counts:
    name: Image findings - ${{ needs.evidence-decision.outputs.scanned_subjects }}/${{ needs.evidence-decision.outputs.exact_subjects }} exact subjects - ${{ needs.evidence-decision.outputs.coverage_gaps }} coverage gaps - SBOM ${{ needs.evidence-decision.outputs.sbom_subjects }}/${{ needs.evidence-decision.outputs.exact_subjects }} - Critical ${{ needs.evidence-decision.outputs.critical_total }} (${{ needs.evidence-decision.outputs.critical_available }} fix available) - High ${{ needs.evidence-decision.outputs.high_total }} (${{ needs.evidence-decision.outputs.high_available }} fix available)
    needs: evidence-decision
    if: needs.evidence-decision.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish coverage and counts in the public check name
        run: |
          printf '%s\n' 'Evidence only; findings do not block promotion.'
          printf '%s\n' 'Counts and verified SBOMs cover the exact discovered subjects only. Coverage gaps are unresolved image sources whose findings remain unknown.'
