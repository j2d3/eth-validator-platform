name: Request non-signing node-pair lifecycle

on:
  workflow_dispatch:
    inputs:
      assignment:
        description: ValidatorAssignment metadata.name
        required: true
        type: string
      action:
        description: Start or stop the execution/beacon-node pair
        required: true
        type: choice
        options:
          - activate
          - stop
      reason:
        description: Auditable reason (3-256 characters)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: node-pair-lifecycle-${{ inputs.assignment }}
  cancel-in-progress: false

jobs:
  open-request:
    name: Open lifecycle request PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSIGNMENT: ${{ inputs.assignment }}
      ACTION: ${{ inputs.action }}
      REASON: ${{ inputs.reason }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out protected desired state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Install catalog dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate dispatch inputs before using them in a branch name
        run: |
          [[ "$ASSIGNMENT" =~ ^[a-z][a-z0-9-]{2,62}$ ]] || {
            echo "assignment must be a DNS-safe catalog name" >&2
            exit 2
          }
          ((${#REASON} >= 3 && ${#REASON} <= 256)) || {
            echo "reason must contain between 3 and 256 characters" >&2
            exit 2
          }
      - name: Create isolated request branch
        run: |
          branch="automation/node-pair-${ASSIGNMENT}-${ACTION}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Apply non-signing lifecycle transition
        run: |
          python3 tools/set_node_pair_lifecycle.py \
            --assignment "$ASSIGNMENT" \
            --action "$ACTION" \
            --reason "$REASON"
          python3 tools/validate_catalog.py
          python3 tools/render_local_assignments.py --check
          python3 -m unittest discover -s tests -v
      - name: Commit generated desired state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/validators/assignments platform/apps/local/assignments
          git diff --cached --quiet && {
            echo "The requested transition produced no change." >&2
            exit 1
          }
          git commit -m "ops: request ${ACTION} for ${ASSIGNMENT}"
          git push --set-upstream origin "$BRANCH"
      - name: Open reviewed GitOps request
        run: |
          body_file="${RUNNER_TEMP}/node-pair-request.md"
          printf '%s\n\n' '*Generated by the non-signing node-pair lifecycle workflow.*' > "$body_file"
          printf 'Assignment: `%s`\nAction: `%s`\n\n' "$ASSIGNMENT" "$ACTION" >> "$body_file"
          printf 'Reason: %s\n\n' "$REASON" >> "$body_file"
          printf '%s\n' 'This request may launch or stop only the execution and beacon-node pair. It cannot enable validator duties or signing. CI and CODEOWNERS review remain mandatory before merge; Flux acts only after merge.' >> "$body_file"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "ops: ${ACTION} ${ASSIGNMENT} node pair" \
            --body-file "$body_file" \
            --reviewer j2d3 \
            --reviewer 5u6r054
