name: Rebase open pull requests

on:
  push:
    branches: [main]

# This workflow only keeps branches current. It never merges a pull request,
# changes review state, or runs code from a pull-request branch.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebase-open-pull-requests-main
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase one eligible pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebase one behind pull request from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          owner=${REPOSITORY%/*}
          name=${REPOSITORY#*/}
          candidate=$(gh api graphql \
            -F owner="$owner" \
            -F name="$name" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(first: 100, states: OPEN, baseRefName: "main") {
                  nodes {
                    number
                    id
                    isDraft
                    headRefOid
                    mergeStateStatus
                    headRepository { nameWithOwner }
                  }
                }
              }
            }' \
            --jq '.data.repository.pullRequests.nodes
              | map(select(.isDraft != true))
              | map(select(.headRepository.nameWithOwner == env.REPOSITORY))
              | map(select(.mergeStateStatus == "BEHIND"))
              | sort_by(.number)
              | .[0] // empty')

          if [[ -z "$candidate" ]]; then
            echo "No eligible behind pull request found"
            exit 0
          fi

          number=$(jq -r '.number' <<<"$candidate")
          pull_request_id=$(jq -r '.id' <<<"$candidate")
          expected_head_oid=$(jq -r '.headRefOid' <<<"$candidate")
          echo "Rebasing PR #$number"
          if ! gh api graphql \
            -F pullRequestId="$pull_request_id" \
            -F expectedHeadOid="$expected_head_oid" \
            -f query='mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
              updatePullRequestBranch(input: {
                pullRequestId: $pullRequestId
                expectedHeadOid: $expectedHeadOid
                updateMethod: REBASE
              }) {
                pullRequest { url }
              }
            }'; then
            echo "PR #$number could not be rebased; leaving it open for review" >&2
            exit 1
          fi
