apiVersion: platform.galaxy-lab/v1alpha1
kind: NetworkProfile
metadata:
  name: ephemery-162
spec:
  family: ephemery
  generation: "162"
  resetPolicy: replace-data
  identity:
    executionChainId: 39438162
    executionNetworkId: 39438162
    executionGenesisHash: "0x7398e3663283d8dbbf92bfdfee7dedd311079fb131ec1ce2501d5b7043f3d7a9"
    consensusGenesisValidatorsRoot: "0xe7ba535e068e129a2e3b17ee6a8f275eee3d1a01126f583ea7b6e867a91c0e5e"
    genesisForkVersion: "0x1000101b"
    consensusGenesisTime: 1785438600
  artifactBundle:
    url: https://github.com/ephemery-testnet/ephemery-genesis/releases/download/ephemery-162/testnet-all.tar.gz
    sha256: 478ca7181212f2d87137c337e854befbed8aacde8bee8f64d6ca7e28967ee2fb
    files:
      executionGenesis: genesis.json
      # Nethermind-format chainspec generated by ethpandaops's
      # ethereum-genesis-generator (tpl-chainspec.json). Ships in the
      # already-pinned Ephemery bundle at the URL/SHA above — no bundle
      # change is needed to add this file to the mapping. Consumed by
      # the Nethermind adapter via --Init.ChainSpecPath; other ELs
      # continue to use executionGenesis.
      executionChainspec: chainspec.json
      consensusConfig: config.yaml
      consensusGenesis: genesis.ssz
      consensusGenesisValidatorsRoot: genesis_validators_root.txt
      executionBootnodes: enodes.txt
      executionBootnode: boot_enode.txt
      consensusBootnodes: boot_enr.yaml
      consensusBootnodesText: boot_enr.txt
      nodeVariables: nodevars_env.txt
      depositContract: deposit_contract.txt
      depositContractBlock: deposit_contract_block.txt
      depositContractBlockHash: deposit_contract_block_hash.txt
      retentionVariables: retention.vars
  clients:
    geth:
      mode: artifact-bundle
    # Reth adapter uses the same digest-verified genesis + bootnode files as
    # Geth; state lives under /data/db/ (per the chart's rethInitCommand).
    # Declaring the adapter here lets a ServiceProfile choose Reth for this
    # network without a schema-level change.
    reth:
      mode: artifact-bundle
    # Erigon adapter uses the same digest-verified genesis + bootnode files
    # as Geth; state lives under /data/chaindata/ (per the chart's
    # erigonInitCommand). Declaring the adapter here lets a ServiceProfile
    # choose Erigon for this network without a schema-level change.
    erigon:
      mode: artifact-bundle
    # Besu adapter uses the same digest-verified genesis + bootnode files
    # as Geth; unlike Geth there is no separate genesis-import step (Besu
    # reads the chain data on first start). State lives under
    # /data/database/ (per the chart's besuRunCommand). Declaring the
    # adapter here lets a ServiceProfile choose Besu for this network
    # without a schema-level change.
    besu:
      mode: artifact-bundle
    # Nethermind adapter consumes the Nethermind-format `chainspec.json`
    # from the bundle via --Init.ChainSpecPath (Nethermind does not read
    # geth-format genesis.json). The chart runs Nethermind with
    # --config=none so no built-in profile is required, and pins
    # --KeyStore.KeyStoreDirectory into the PVC because the default
    # /nethermind/keystore/node.key.plain path fails under the chart's
    # read-only-root Pod contract. Declaring the adapter here lets a
    # ServiceProfile choose Nethermind for this network without a
    # schema-level change.
    nethermind:
      mode: artifact-bundle
    lighthouse:
      mode: artifact-bundle
    # Teku adapter uses the same generation-pinned config.yaml as Lighthouse
    # (passed via --network=<file>) and the same consensusBootnodesText for
    # --p2p-discovery-bootnodes.
    teku:
      mode: artifact-bundle
    # Prysm adapter cannot consume the generic Ephemery config.yaml
    # directly: Prysm rejects the EPHEMERY_RESET_PERIOD and
    # NUMBER_OF_COLUMNS keys, then inherits a mainnet Gloas fork-version
    # collision. The chart's prysm init container derives
    # /network/files/prysm-config.yaml from the bundle's config.yaml
    # (remove the two rejected keys, append GLOAS_FORK_VERSION /
    # GLOAS_FORK_EPOCH, fail on unexpected source shape) after bundle
    # SHA verification. Runtime-verified by Codex against Prysm v7.1.8
    # on 2026-08-05.
    prysm:
      mode: artifact-bundle
    # Nimbus adapter reads the network directory (via --network=<dir>) that
    # contains the generation-pinned config.yaml plus the digest-verified
    # bootnode list; --bootstrap-file is pointed at the line-delimited ENR
    # file consensusBootnodesText. Declaring the adapter here lets a
    # ServiceProfile choose Nimbus for this network without a schema-level
    # change.
    nimbus:
      mode: artifact-bundle
  signer:
    web3signer:
      mode: artifact-bundle
      signingQualified: true
  checkpointSync:
    primaryUrl: https://checkpoint-sync.ephemery.ethpandaops.io/
    verificationUrls:
      - https://ephemery.beaconstate.ethstaker.cc/
  reset:
    intervalSeconds: 2419200
    successorPolicy: explicit-reviewed-pr
  deposit:
    contractAddress: "0x00000000219ab540356cBB839Cbe05303d7705Fa"
    deployBlock: 0
