{{- if eq .Values.lifecycleState "active" }}
{{- $execution := index .Values.executionClients .Values.executionClient -}}
{{- $consensus := index .Values.consensusClients .Values.consensusClient -}}
{{- /* Adapter for the currently selected EL — dispatched on executionClient so
     a Reth pair reads its own network adapter, not always Geth's. */ -}}
{{- $executionAdapter := index .Values.networkProfile.clients .Values.executionClient -}}
{{- if not $executionAdapter -}}
{{- fail (printf "networkProfile.clients.%s is required when executionClient=%q" .Values.executionClient .Values.executionClient) -}}
{{- end -}}
{{- /* Adapter for the currently selected CL — dispatched on consensusClient so
     a Teku pair reads its own network adapter rather than always Lighthouse's.
     Lighthouse is required by the network-profile schema and so is always
     present as a fallback, but the mode-consistency check below must compare
     the EL's mode to the CL that will actually run. */ -}}
{{- $consensusAdapter := index .Values.networkProfile.clients .Values.consensusClient -}}
{{- if not $consensusAdapter -}}
{{- fail (printf "networkProfile.clients.%s is required when consensusClient=%q" .Values.consensusClient .Values.consensusClient) -}}
{{- end -}}
{{- if ne $executionAdapter.mode $consensusAdapter.mode -}}
{{- fail (printf "%s and %s network adapter modes must match" .Values.executionClient .Values.consensusClient) -}}
{{- end -}}
{{- $artifactMode := eq $executionAdapter.mode "artifact-bundle" -}}
{{- /* Built-in-mode is currently Geth+Lighthouse only; the args blocks for
     that path hard-code Geth and Lighthouse flag names. Fail loudly if
     someone tries to render a Reth, Erigon, Besu, or Teku pair on a
     built-in network — a future PR can extract those args behind
     per-client helpers. */ -}}
{{- if and (eq .Values.executionClient "reth") (not $artifactMode) -}}
{{- fail "executionClient=reth requires networkProfile.clients.reth.mode = artifact-bundle in this chart version" -}}
{{- end -}}
{{- if and (eq .Values.executionClient "erigon") (not $artifactMode) -}}
{{- fail "executionClient=erigon requires networkProfile.clients.erigon.mode = artifact-bundle in this chart version" -}}
{{- end -}}
{{- if and (eq .Values.executionClient "besu") (not $artifactMode) -}}
{{- fail "executionClient=besu requires networkProfile.clients.besu.mode = artifact-bundle in this chart version" -}}
{{- end -}}
{{- if and (eq .Values.consensusClient "teku") (not $artifactMode) -}}
{{- fail "consensusClient=teku requires networkProfile.clients.teku.mode = artifact-bundle in this chart version" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethereum-node.fullname" . }}
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ethereum-node.fullname" . }}
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "ethereum-node.selectorLabels" . | nindent 6 }}
      platform.galaxy-lab/component: node
  template:
    metadata:
      labels:
        {{- include "ethereum-node.selectorLabels" . | nindent 8 }}
        {{- include "ethereum-node.identityLabels" . | nindent 8 }}
        platform.galaxy-lab/component: node
      annotations:
        prometheus.io/scrape: "true"
        platform.galaxy-lab/network-identity: {{ .Values.networkProfile.identityFingerprint | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.availability.nodeTerminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if .Values.scheduling.preferSpot }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: eks.amazonaws.com/capacityType
                    operator: In
                    values: [SPOT]
      {{- end }}
      {{- if $artifactMode }}
      initContainers:
        - name: fetch-network-artifacts
          image: {{ .Values.networkArtifactLoader.downloadImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [curl]
          args:
            - --fail
            - --location
            - --proto
            - =https
            - --tlsv1.2
            - --retry
            - "3"
            - --retry-all-errors
            - --connect-timeout
            - "15"
            - --max-time
            - "120"
            - --max-filesize
            - "16777216"
            - --output
            - /network/testnet-all.tar.gz
            - {{ .Values.networkProfile.artifactBundle.url | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: network-artifacts, mountPath: /network}
        - name: verify-network-artifacts
          image: {{ .Values.networkArtifactLoader.verifyImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              printf '%s  %s\n' {{ .Values.networkProfile.artifactBundle.sha256 | quote }} /network/testnet-all.tar.gz | sha256sum -c -
              mkdir -p /network/files
              tar -xzf /network/testnet-all.tar.gz -C /network/files \
              {{- range $path := .Values.networkProfile.artifactBundle.files }}
                {{ $path | quote }} \
              {{- end }}
              ;
              {{- range $path := .Values.networkProfile.artifactBundle.files }}
              test -s {{ printf "/network/files/%s" $path | quote }}
              {{- end }}
              printf '%s\n' {{ .Values.networkProfile.identityFingerprint | quote }} > /network/.verified-identity
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: network-artifacts, mountPath: /network}
        - name: {{ printf "initialize-%s-genesis" .Values.executionClient }}
          image: {{ $execution.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
{{ include "ethereum-node.executionInitCommand" . | indent 14 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: execution-data, mountPath: /data}
            - {name: network-artifacts, mountPath: /network, readOnly: true}
            - {name: execution-runtime, mountPath: /tmp}
      {{- end }}
      containers:
        - name: execution
          image: {{ $execution.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if $artifactMode }}
          command: [/bin/sh, -ec]
          args:
            - |
{{ include "ethereum-node.executionRunCommand" . | indent 14 }}
          {{- else }}
          {{- /* Built-in-network mode currently supports only Geth's argument
               shape. A future adapter can extract these args behind a per-EL
               helper, matching the artifact-mode command dispatch. Until then
               the schema constrains Reth to artifact-bundle mode. */}}
          args:
            - {{ printf "--%s" $executionAdapter.network | quote }}
            - {{ printf "--syncmode=%s" $execution.syncMode | quote }}
            - --datadir=/data
            - --http
            - --http.addr=0.0.0.0
            - --http.api=eth,net,web3
            - --authrpc.addr=0.0.0.0
            - --authrpc.port=8551
            - --authrpc.vhosts=*
            - --authrpc.jwtsecret=/jwt/jwt.hex
            - --metrics
            - --metrics.addr=0.0.0.0
            - --metrics.port=6060
          {{- end }}
          ports:
            - {name: el-rpc, containerPort: 8545, protocol: TCP}
            - {name: el-engine, containerPort: 8551, protocol: TCP}
            - {name: el-p2p-tcp, containerPort: 30303, protocol: TCP}
            - {name: el-p2p-udp, containerPort: 30303, protocol: UDP}
            - {name: el-metrics, containerPort: 6060, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: el-rpc}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          startupProbe:
            tcpSocket: {port: el-rpc}
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            tcpSocket: {port: el-rpc}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.execution | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: execution-data, mountPath: /data}
            - {name: engine-jwt, mountPath: /jwt, readOnly: true}
            - {name: execution-runtime, mountPath: /tmp}
            {{- if $artifactMode }}
            - {name: network-artifacts, mountPath: /network, readOnly: true}
            {{- end }}
        - name: consensus
          image: {{ $consensus.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if $artifactMode }}
          command: [/bin/sh, -ec]
          args:
            - |
{{ include "ethereum-node.consensusRunCommand" . | indent 14 }}
          {{- else }}
          command: [lighthouse]
          args:
            - bn
            - {{ printf "--network=%s" $consensusAdapter.network | quote }}
            - --datadir=/data
            - --execution-endpoint=http://127.0.0.1:8551
            - --execution-jwt=/jwt/jwt.hex
            - --http
            - --http-address=0.0.0.0
            - --http-port=5052
            - --metrics
            - --metrics-address=0.0.0.0
            - --metrics-port=8008
          {{- end }}
          ports:
            - {name: cl-api, containerPort: 5052, protocol: TCP}
            - {name: cl-p2p-tcp, containerPort: 9000, protocol: TCP}
            - {name: cl-p2p-udp, containerPort: 9000, protocol: UDP}
            - {name: cl-quic, containerPort: 9001, protocol: UDP}
            - {name: cl-metrics, containerPort: 8008, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: cl-api}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          startupProbe:
            tcpSocket: {port: cl-api}
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            tcpSocket: {port: cl-api}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.consensus | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: consensus-data, mountPath: /data}
            - {name: engine-jwt, mountPath: /jwt, readOnly: true}
            - {name: consensus-runtime, mountPath: /tmp}
            {{- if $artifactMode }}
            - {name: network-artifacts, mountPath: /network, readOnly: true}
            {{- end }}
      volumes:
        - name: execution-data
          persistentVolumeClaim:
            claimName: {{ include "ethereum-node.executionPvcName" . }}
        - name: consensus-data
          persistentVolumeClaim:
            claimName: {{ include "ethereum-node.consensusPvcName" . }}
        - name: engine-jwt
          secret:
            secretName: {{ include "ethereum-node.fullname" . }}-engine-jwt
        - name: execution-runtime
          emptyDir:
            sizeLimit: 256Mi
        - name: consensus-runtime
          emptyDir:
            sizeLimit: 256Mi
        {{- if $artifactMode }}
        - name: network-artifacts
          emptyDir:
            sizeLimit: 32Mi
        {{- end }}
{{- end }}
