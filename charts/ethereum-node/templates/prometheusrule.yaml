{{- if and (eq .Values.lifecycleState "active") .Values.monitoring.enabled }}
{{- $telemetryLabels := include "ethereum-node.telemetryLabels" . -}}
{{- /*
Each EL and CL adapter provides a `metrics:` map naming the Prometheus series
that client exposes for a fixed set of concepts (peers, head_block, head_slot,
etc.). The recording rules below build `validator_platform_execution_*` and
`validator_platform_consensus_*` normalizations by taking an `or` union of the
per-client aggregations, each filtered by the `execution_client` /
`consensus_client` label so exactly one client's metric contributes per pair.

Adding a new EL or CL adapter with a `metrics:` block populates the union
automatically — no PrometheusRule edit required. Metric names that turn out
to be wrong for a given client render as an empty series for that pair, not a
render error; the operator verifies each client's names against a live Pod's
/metrics output.
*/}}
{{- $execClients := .Values.executionClients -}}
{{- $consClients := .Values.consensusClients -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ethereum-node.fullname" . }}
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
spec:
  groups:
    - name: ethereum-pair.normalization
      interval: 30s
      rules:
        - record: validator_platform_pair_target_up
          expr: max by ({{ $telemetryLabels }}, component) (up{platform="ethereum-validator"})

        {{- /* Execution-layer normalizations. Union across every registered EL. */}}
        - record: validator_platform_execution_peers
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $execClients -}}
            {{- $one := printf "max by (%s) (%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"})" $telemetryLabels $spec.metrics.peers $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        - record: validator_platform_execution_head_block
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $execClients -}}
            {{- $one := printf "max by (%s) (%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"})" $telemetryLabels $spec.metrics.headBlock $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        {{- /*
        head_header + internal_sync_distance skip clients that don't declare
        `headHeader`. Reth's staged pipeline doesn't surface a downloaded-
        header-frontier gauge distinct from canonical-chain height, so mapping
        both concepts to the same series would publish sync_distance=0
        regardless of actual sync state. Per PRD §12.5, missing telemetry is
        unsupported/not collected, not zero. Clients without headHeader are
        omitted from both series entirely.
        */}}
        {{- $headerClients := dict -}}
        {{- range $client, $spec := $execClients -}}
        {{- if hasKey $spec.metrics "headHeader" -}}
        {{- $_ := set $headerClients $client $spec -}}
        {{- end -}}
        {{- end }}
        {{- if $headerClients }}
        - record: validator_platform_execution_head_header
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $headerClients -}}
            {{- $one := printf "max by (%s) (%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"})" $telemetryLabels $spec.metrics.headHeader $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        - record: validator_platform_execution_internal_sync_distance
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $headerClients -}}
            {{- $one := printf "clamp_min(max by (%s) (%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"}) - max by (%s) (%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"}), 0)" $telemetryLabels $spec.metrics.headHeader $client $telemetryLabels $spec.metrics.headBlock $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        {{- end }}
        - record: validator_platform_execution_head_changes_15m
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $execClients -}}
            {{- $one := printf "max by (%s) (changes(%s{platform=\"ethereum-validator\",component=\"execution\",execution_client=\"%s\"}[15m]))" $telemetryLabels $spec.metrics.headBlock $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}

        {{- /* Consensus-layer normalizations. Union across every registered CL. */}}
        - record: validator_platform_consensus_peers
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $consClients -}}
            {{- $one := printf "sum by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"})" $telemetryLabels $spec.metrics.peers $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        - record: validator_platform_consensus_head_changes_15m
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $consClients -}}
            {{- $one := printf "max by (%s) (changes(%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}[15m]))" $telemetryLabels $spec.metrics.headSlot $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        - record: validator_platform_consensus_slot_lag
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $consClients -}}
            {{- $one := printf "clamp_min(max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}) - max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}), 0)" $telemetryLabels $spec.metrics.presentSlot $client $telemetryLabels $spec.metrics.headSlot $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        - record: validator_platform_consensus_finality_lag_epochs
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $consClients -}}
            {{- if hasKey $spec.metrics "presentEpoch" -}}
            {{- $one := printf "clamp_min(max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}) - max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}), 0)" $telemetryLabels $spec.metrics.presentEpoch $client $telemetryLabels $spec.metrics.finalizedEpoch $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- else -}}
            {{/* Client publishes a slot gauge but no direct present-epoch (e.g. Prysm's beacon_clock_time_slot / no beacon_current_epoch). Derive the current epoch as floor(presentSlot / presentEpochDivisor). */}}
            {{- $one := printf "clamp_min(floor(max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}) / %d) - max by (%s) (%s{platform=\"ethereum-validator\",component=\"consensus\",consensus_client=\"%s\"}), 0)" $telemetryLabels $spec.metrics.presentSlot $client (int $spec.metrics.presentEpochDivisor) $telemetryLabels $spec.metrics.finalizedEpoch $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end -}}
            {{- end }}
            {{ join " or " $exprs }}

        {{- /* Validator-client + container-resource rules. */}}
        {{- $validatorClients := dict -}}
        {{- range $client, $spec := $consClients -}}
        {{- if hasKey $spec.metrics "validatorEnabled" -}}
        {{- $_ := set $validatorClients $client $spec -}}
        {{- end -}}
        {{- end }}
        {{- if $validatorClients }}
        - record: validator_platform_validator_enabled
          expr: >-
            {{- $exprs := list -}}
            {{- range $client, $spec := $validatorClients -}}
            {{- $one := printf "max by (%s) (%s{platform=\"ethereum-validator\",component=\"validator\",consensus_client=\"%s\"})" $telemetryLabels $spec.metrics.validatorEnabled $client -}}
            {{- $exprs = append $exprs $one -}}
            {{- end }}
            {{ join " or " $exprs }}
        {{- end }}
        {{- /*
        Client process metrics are not portable: several EL images omit
        process_cpu_seconds_total and process_resident_memory_bytes. cAdvisor
        exposes the container resource contract consistently. Its samples do
        not carry platform identity, so join them to the controlled assignment
        label exposed by kube-state-metrics, derive component from the exact
        container name, and inherit the remaining telemetry labels from the
        existing target rule. The `(0 * target + 1)` term uses target_up only
        as identity metadata; a down metrics target must not turn real cgroup
        usage into a false zero.
        */}}
        - record: validator_platform_container_cpu_cores
          expr: >-
            sum by ({{ $telemetryLabels }}, component) (
              max by (namespace, pod, assignment_id, component) (
                label_replace(
                  label_replace(
                    rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",container=~"execution|consensus|validator",image!=""}[5m])
                    * on (namespace, pod) group_left(label_platform_galaxy_lab_assignment_id)
                      max by (namespace, pod, label_platform_galaxy_lab_assignment_id) (
                        kube_pod_labels{namespace="{{ .Release.Namespace }}",label_platform_galaxy_lab_assignment_id!=""}
                      ),
                    "assignment_id", "$1", "label_platform_galaxy_lab_assignment_id", "(.+)"
                  ),
                  "component", "$1", "container", "(execution|consensus|validator)"
                )
              )
              * on (assignment_id, component)
                group_left(cluster, environment, lifecycle_state, network, network_profile, network_generation, network_identity, customer_id, validator_id, execution_client, consensus_client)
                (
                  0 * max by ({{ $telemetryLabels }}, component) (
                    validator_platform_pair_target_up{component=~"execution|consensus|validator"}
                  ) + 1
                )
            )
        - record: validator_platform_container_memory_working_set_bytes
          expr: >-
            sum by ({{ $telemetryLabels }}, component) (
              max by (namespace, pod, assignment_id, component) (
                label_replace(
                  label_replace(
                    container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}",container=~"execution|consensus|validator",image!=""}
                    * on (namespace, pod) group_left(label_platform_galaxy_lab_assignment_id)
                      max by (namespace, pod, label_platform_galaxy_lab_assignment_id) (
                        kube_pod_labels{namespace="{{ .Release.Namespace }}",label_platform_galaxy_lab_assignment_id!=""}
                      ),
                    "assignment_id", "$1", "label_platform_galaxy_lab_assignment_id", "(.+)"
                  ),
                  "component", "$1", "container", "(execution|consensus|validator)"
                )
              )
              * on (assignment_id, component)
                group_left(cluster, environment, lifecycle_state, network, network_profile, network_generation, network_identity, customer_id, validator_id, execution_client, consensus_client)
                (
                  0 * max by ({{ $telemetryLabels }}, component) (
                    validator_platform_pair_target_up{component=~"execution|consensus|validator"}
                  ) + 1
                )
            )

    - name: ethereum-pair.alerts
      interval: 30s
      rules:
        - alert: EthereumPairTargetUnavailable
          expr: >-
            validator_platform_pair_target_up{assignment_id="{{ .Values.identity.assignmentId }}",component=~"execution|consensus"} < 1
            or absent(validator_platform_pair_target_up{assignment_id="{{ .Values.identity.assignmentId }}",component="execution"})
            or absent(validator_platform_pair_target_up{assignment_id="{{ .Values.identity.assignmentId }}",component="consensus"})
          for: 5m
          labels:
            severity: warning
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Execution or consensus metrics target unavailable"
            description: "An active client pair has a missing or failed execution/consensus metrics target for five minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"

        {{- if .Values.validator.enabled }}
        - alert: EthereumValidatorTargetUnavailable
          expr: >-
            validator_platform_pair_target_up{assignment_id="{{ .Values.identity.assignmentId }}",component="validator"} < 1
            or absent(validator_platform_pair_target_up{assignment_id="{{ .Values.identity.assignmentId }}",component="validator"})
          for: 2m
          labels:
            severity: critical
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Enabled validator metrics target unavailable"
            description: "An enabled validator client's metrics target has been missing or down for two minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"
        {{- end }}

        - alert: EthereumExecutionHeadStalled
          expr: >-
            validator_platform_execution_head_changes_15m{assignment_id="{{ .Values.identity.assignmentId }}"} < 1
          for: 5m
          labels:
            severity: warning
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Execution head has not advanced"
            description: "The execution head recorded no change during the rolling 15-minute window and remained stalled for five minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"

        - alert: EthereumConsensusHeadStalled
          expr: >-
            validator_platform_consensus_head_changes_15m{assignment_id="{{ .Values.identity.assignmentId }}"} < 1
          for: 5m
          labels:
            severity: warning
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Consensus head has not advanced"
            description: "The consensus head recorded no change during the rolling 15-minute window and remained stalled for five minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"

        - alert: EthereumConsensusSlotLagHigh
          expr: >-
            validator_platform_consensus_slot_lag{assignment_id="{{ .Values.identity.assignmentId }}"} > 8
          for: 5m
          labels:
            severity: warning
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Consensus head is more than eight slots behind"
            description: "Consensus slot lag remained above eight slots for five minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"

        - alert: EthereumConsensusFinalityLagHigh
          expr: >-
            validator_platform_consensus_finality_lag_epochs{assignment_id="{{ .Values.identity.assignmentId }}"} > 4
          for: 10m
          labels:
            severity: warning
            assignment_id: {{ .Values.identity.assignmentId | quote }}
            network: {{ .Values.networkProfile.family | quote }}
            execution_client: {{ .Values.executionClient | quote }}
            consensus_client: {{ .Values.consensusClient | quote }}
          annotations:
            summary: "Consensus finality is more than four epochs behind"
            description: "Consensus finality lag remained above four epochs for ten minutes."
            runbook_url: "https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md"
{{- end }}
