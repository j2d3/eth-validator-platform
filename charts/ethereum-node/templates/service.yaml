{{- $p2pService := .Values.p2p.service -}}
{{- $p2pAnnotations := $p2pService.annotations -}}
{{- if and $p2pService.enabled (hasKey $p2pAnnotations "service.beta.kubernetes.io/aws-load-balancer-type") -}}
  {{- fail "AWS P2P Service must use loadBalancerClass, not the legacy aws-load-balancer-type annotation" -}}
{{- end -}}
{{- if and $p2pService.enabled (eq $p2pService.loadBalancerClass "service.k8s.aws/nlb") -}}
  {{- if ne $p2pService.type "LoadBalancer" -}}
    {{- fail "p2p.service.loadBalancerClass=service.k8s.aws/nlb requires type=LoadBalancer" -}}
  {{- end -}}
  {{- if ne (default "" (index $p2pAnnotations "service.beta.kubernetes.io/aws-load-balancer-nlb-target-type")) "ip" -}}
    {{- fail "AWS LBC P2P Service requires aws-load-balancer-nlb-target-type=ip" -}}
  {{- end -}}
  {{- if ne (default "" (index $p2pAnnotations "service.beta.kubernetes.io/aws-load-balancer-enable-tcp-udp-listener")) "true" -}}
    {{- fail "AWS LBC P2P Service requires aws-load-balancer-enable-tcp-udp-listener=true" -}}
  {{- end -}}
{{- end -}}
{{- if eq .Values.lifecycleState "active" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethereum-node.fullname" . }}
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ethereum-node.selectorLabels" . | nindent 4 }}
    platform.galaxy-lab/component: node
  ports:
    - {name: cl-api, port: 5052, targetPort: cl-api}
    - {name: el-metrics, port: 6060, targetPort: el-metrics}
    - {name: cl-metrics, port: 8008, targetPort: cl-metrics}
---
{{- if $p2pService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethereum-node.fullname" . }}-{{ $p2pService.nameSuffix }}
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
  {{- with $p2pAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $p2pService.type }}
  {{- if and (eq $p2pService.type "LoadBalancer") $p2pService.loadBalancerClass }}
  loadBalancerClass: {{ $p2pService.loadBalancerClass | quote }}
  {{- end }}
  {{- if ne $p2pService.type "ClusterIP" }}
  externalTrafficPolicy: {{ $p2pService.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq $p2pService.type "LoadBalancer") $p2pService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $p2pService.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "ethereum-node.selectorLabels" . | nindent 4 }}
    platform.galaxy-lab/component: node
  ports:
    - {name: el-p2p-tcp, port: 30303, targetPort: el-p2p-tcp, protocol: TCP}
    - {name: el-p2p-udp, port: 30303, targetPort: el-p2p-udp, protocol: UDP}
    - {name: cl-p2p-tcp, port: 9000, targetPort: cl-p2p-tcp, protocol: TCP}
    - {name: cl-p2p-udp, port: 9000, targetPort: cl-p2p-udp, protocol: UDP}
    - {name: cl-quic, port: 9001, targetPort: cl-quic, protocol: UDP}
{{- end }}
{{- end }}
