{{- if and (eq .Values.lifecycleState "active") .Values.validator.enabled }}
{{- $lighthouseAdapter := .Values.networkProfile.clients.lighthouse -}}
{{- $artifactMode := eq $lighthouseAdapter.mode "artifact-bundle" -}}
{{- if not .Values.networkProfile.signer.web3signer.signingQualified -}}
{{- fail "validator duties require a qualified Web3Signer network binding" -}}
{{- end -}}
{{- if not .Values.validator.slashingProtectionConfirmed -}}
{{- fail "validator.slashingProtectionConfirmed must be true before validator duties can start" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ethereum-node.fullname" . }}-validator-config
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
data:
  validator_definitions.yml: |
    ---
    - enabled: true
      voting_public_key: {{ required "validator.publicKey is required when validator.enabled=true" .Values.validator.publicKey | quote }}
      type: web3signer
      url: {{ .Values.web3signer.endpoint | quote }}
      suggested_fee_recipient: {{ required "validator.feeRecipient is required when validator.enabled=true" .Values.validator.feeRecipient | quote }}
      graffiti: {{ .Values.validator.graffiti | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ethereum-node.fullname" . }}-validator
  labels:
    {{- include "ethereum-node.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ethereum-node.selectorLabels" . | nindent 6 }}
      platform.galaxy-lab/component: validator
  template:
    metadata:
      labels:
        {{- include "ethereum-node.selectorLabels" . | nindent 8 }}
        {{- include "ethereum-node.identityLabels" . | nindent 8 }}
        platform.galaxy-lab/component: validator
      annotations:
        platform.galaxy-lab/network-identity: {{ .Values.networkProfile.identityFingerprint | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.availability.validatorTerminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if .Values.scheduling.preferSpot }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: eks.amazonaws.com/capacityType
                    operator: In
                    values: [SPOT]
      {{- end }}
      initContainers:
        - name: configure-validator
          image: {{ .Values.validatorClient.initImage }}
          command: [sh, -ec]
          args: ["cp /config/validator_definitions.yml /validator-data/validator_definitions.yml"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: validator-config, mountPath: /config, readOnly: true}
            - {name: validator-data, mountPath: /validator-data}
        {{- if $artifactMode }}
        - name: fetch-validator-genesis
          image: {{ .Values.networkArtifactLoader.downloadImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              curl --fail --location --connect-timeout 10 --max-time 60 \
                --max-filesize 16777216 --header 'Accept: application/octet-stream' \
                --output /validator-network/genesis.ssz \
                http://{{ include "ethereum-node.fullname" . }}:5052/eth/v2/debug/beacon/states/genesis
              curl --fail --location --connect-timeout 10 --max-time 30 \
                --max-filesize 4096 --output /validator-network/genesis.json \
                http://{{ include "ethereum-node.fullname" . }}:5052/eth/v1/beacon/genesis
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: validator-network, mountPath: /validator-network}
        - name: verify-validator-network
          image: {{ .Values.networkArtifactLoader.verifyImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              test -s /validator-network/genesis.ssz
              grep -F {{ printf "\"genesis_time\":\"%d\"" (int64 .Values.networkProfile.identity.consensusGenesisTime) | quote }} /validator-network/genesis.json
              grep -F {{ printf "\"genesis_validators_root\":\"%s\"" .Values.networkProfile.identity.consensusGenesisValidatorsRoot | quote }} /validator-network/genesis.json
              cp /network-source/config.yaml /validator-network/config.yaml
              cp /network-source/deposit_contract_block.txt /validator-network/deposit_contract_block.txt
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: validator-network-source, mountPath: /network-source, readOnly: true}
            - {name: validator-network, mountPath: /validator-network}
        {{- end }}
      containers:
        - name: validator
          image: {{ .Values.validatorClient.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [lighthouse]
          args:
            - vc
            {{- if $artifactMode }}
            - --testnet-dir=/validator-network
            {{- else }}
            - {{ printf "--network=%s" .Values.networkProfile.clients.lighthouse.network | quote }}
            {{- end }}
            - --beacon-nodes=http://{{ include "ethereum-node.fullname" . }}:5052
            - --validators-dir=/validator-data
            - --suggested-fee-recipient={{ .Values.validator.feeRecipient }}
            - --init-slashing-protection
            - --enable-doppelganger-protection
            - --disable-slashing-protection-web3signer
            - --metrics
            - --metrics-address=0.0.0.0
            - --metrics-port=5064
          ports:
            - {name: metrics, containerPort: 5064}
          resources:
            {{- toYaml .Values.validatorClient.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: validator-data, mountPath: /validator-data}
            - {name: validator-runtime, mountPath: /tmp}
            {{- if $artifactMode }}
            - {name: validator-network, mountPath: /validator-network, readOnly: true}
            {{- end }}
      volumes:
        - name: validator-config
          configMap:
            name: {{ include "ethereum-node.fullname" . }}-validator-config
        - name: validator-data
          persistentVolumeClaim:
            claimName: {{ include "ethereum-node.validatorPvcName" . }}
        - name: validator-runtime
          emptyDir:
            sizeLimit: 64Mi
        {{- if $artifactMode }}
        - name: validator-network-source
          configMap:
            name: {{ required "validator.networkConfigMapName is required for artifact-bundle signing" .Values.validator.networkConfigMapName }}
            items:
              - key: config.yaml
                path: config.yaml
              - key: deposit_contract_block.txt
                path: deposit_contract_block.txt
        - name: validator-network
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
{{- end }}
