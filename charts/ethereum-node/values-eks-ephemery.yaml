# Ephemery node-only profile for the single EKS development environment.
#
# These claims are a bounded first-sync hypothesis for a chain that resets
# roughly every four weeks. They are intentionally smaller than Hoodi's
# permanent-network claims and can grow online; they cannot shrink. Runtime
# usage and growth evidence must revise them before they become guidance.
storageClassName: ebs-gp3-encrypted
storage:
  execution: 50Gi
  consensus: 20Gi
  validator: 5Gi

# Ephemery is a short, resetting chain. Replaying its bounded history is an
# acceptable trade for avoiding the snap-pivot failure surface observed during
# the first EKS restart exercise. This is not the default for permanent chains.
executionClients:
  geth:
    syncMode: full

# Client-diversity pairs sync through outbound peers by default. The dev
# Kustomize overlay promotes exactly one selected pair to an AWS LBC-owned
# public NLB, keeping the lab at one billed P2P load balancer instead of one
# per pair. JSON-RPC, Engine API, beacon API, and metrics remain on the separate
# ClusterIP Service.
p2p:
  service:
    enabled: true
    nameSuffix: p2p
    type: ClusterIP
    loadBalancerClass: ""
    annotations: {}
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []

# Prefer the already-bounded zonal Spot groups while retaining an on-demand
# recovery path. The hard workload selector and taint/toleration still prevent
# the pair from landing on system nodes.
scheduling:
  preferSpot: true

# The node pair has one replica, so a minAvailable=1 node PDB would only
# obstruct voluntary Spot draining without providing redundancy. The validator
# client keeps its own minAvailable=1 PDB. AWS recommends no more than 30
# seconds of termination grace for EKS Spot workloads.
availability:
  nodeTerminationGracePeriodSeconds: 30
  nodeDisruptionBudgetEnabled: false

# Requests fit one 8-vCPU/64-GiB Ethereum worker with room for the node and CSI
# daemons. CPU limits are bounded to the worker's nominal capacity; memory
# limits leave substantial interruption/recovery headroom.
resources:
  execution:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "5"
      memory: 24Gi
  consensus:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "3"
      memory: 16Gi
