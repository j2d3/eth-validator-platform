nameOverride: ""
fullnameOverride: ""

# Safe by default: stopped retains lifecycle metadata and PVC declarations, but starts no clients.
# The first qualified vertical slice is deliberately Geth + Lighthouse. Other pair adapters land
# only after their flags, ports, probes, signer integration, and metrics have dedicated tests.
lifecycleState: stopped
networkProfile:
  name: hoodi
  family: hoodi
  generation: permanent
  resetPolicy: persistent
  identityFingerprint: c7484b91cd367b3b99a8e6dbfc92fe637ee435fa8a4d55cc5904777bf0e574b2
  identity:
    executionChainId: 560048
    executionNetworkId: 560048
    executionGenesisHash: "0xbbe312868b376a3001692a646dd2d7d1e4406380dfd86b98aa8a34d1557c971b"
    consensusGenesisValidatorsRoot: "0x212f13fc4df078b6cb7db228f1c8307566dcecf900867401a92023d7ba99cb5f"
    genesisForkVersion: "0x10000910"
    consensusGenesisTime: 1742213400
  clients:
    geth:
      mode: builtin
      network: hoodi
    # Reth adapter default: mirrors Geth's builtin+hoodi shape so a Reth pair
    # renders correctly against the default Hoodi profile if selected. Networks
    # that only intend to run one EL can drop the unused adapter locally.
    reth:
      mode: builtin
      network: hoodi
    lighthouse:
      mode: builtin
      network: hoodi
    # Teku adapter default: mirrors Lighthouse's builtin+hoodi shape so a Teku
    # pair renders correctly against the default Hoodi profile if selected.
    # Networks that only run one CL can drop the unused adapter locally.
    teku:
      mode: builtin
      network: hoodi
    # Nimbus adapter default: same shape as the other CL clients.
    nimbus:
      mode: builtin
      network: hoodi
    # Prysm adapter default: same shape as the other CL clients. The
    # artifact-bundle assignments override this via the projection tool's
    # `network: null` clearing (same pattern as the other CLs). Prysm
    # additionally requires a rendered `prysm-config.yaml` derived from the
    # bundle's `config.yaml`; the derivation only runs on artifact-bundle
    # profiles (built-in networks pass `--prater-testnet` / `--mainnet`
    # style selectors instead).
    prysm:
      mode: builtin
      network: hoodi
    # Erigon adapter default: mirrors Geth/Reth's builtin+hoodi shape so an
    # Erigon pair renders correctly against the default Hoodi profile if
    # selected. The artifact-bundle assignments override this via the
    # projection tool's network: null clearing (same pattern as Reth).
    erigon:
      mode: builtin
      network: hoodi
    # Besu adapter default: same shape as the other ELs so a Besu pair
    # renders correctly against the default Hoodi profile if selected.
    besu:
      mode: builtin
      network: hoodi
    # Nethermind adapter default: same shape as the other ELs.
    nethermind:
      mode: builtin
      network: hoodi
  signer:
    web3signer:
      mode: builtin
      network: hoodi
      signingQualified: false

# Custom/resetting networks use these digest-pinned tools to fetch and verify
# one immutable release bundle before either client starts. Built-in networks
# do not create these init containers.
networkArtifactLoader:
  downloadImage: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
  verifyImage: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
executionClient: geth
consensusClient: lighthouse

identity:
  customerId: customer-synthetic-lab
  validatorId: validator-synthetic-01
  assignmentId: assignment-synthetic-01

# Environment identity carried onto every scraped series and retained through
# every recording-rule aggregation. These are deliberately chart values rather
# than Prometheus externalLabels: external labels are applied on remote-write
# and federation, not to locally queried series, so they could not be selected
# on in a dashboard query. The defaults below are the local kind lab; every
# other environment overlay must override both, and the schema requires them.
telemetry:
  cluster: kind-eth-validator-local
  environment: local

imagePullPolicy: IfNotPresent
storageClassName: standard
storage:
  execution: 20Gi
  consensus: 10Gi
  validator: 5Gi

# P2P is a separate surface from the internal HTTP/metrics Service. The chart
# default stays cluster-internal; an environment must explicitly opt into a
# public Service and own its cloud-controller/cost contract.
p2p:
  service:
    enabled: true
    nameSuffix: p2p
    type: ClusterIP
    loadBalancerClass: ""
    annotations: {}
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []

engineJwt:
  secretStoreName: local-platform-secrets
  remoteSecretKey: engine-jwt
  remoteSecretProperty: jwt.hex

validator:
  enabled: false
  publicKey: ""
  feeRecipient: ""
  graffiti: eth-validator-platform-lab
  # Required acknowledgment before the chart starts signing components.
  slashingProtectionConfirmed: false

web3signer:
  # The pair never mounts validator key material. Its validator client calls this shared service.
  endpoint: http://web3signer.signing.svc.cluster.local:9000

validatorClient:
  image: sigp/lighthouse:v8.2.1@sha256:9538f53d8e11766e3cb5de1889b292074f8e518e0dabe6df13d9054d504d1d62
  initImage: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

executionClients:
  geth:
    image: ethereum/client-go:v1.17.5@sha256:523d3ba26623a619e912019068dc2784f02934070ac46bdae4d5b9df0d917814
    # Snap remains the general default for permanent networks. Short-lived
    # environment profiles may select full sync when replaying their bounded
    # chain is cheaper than carrying snap-sync recovery complexity.
    syncMode: snap
    # Native Prometheus metric names Geth exposes on --metrics.port that this
    # chart's PrometheusRule aggregates into `validator_platform_execution_*`.
    # Every EL adapter provides the same map so a single recording-rule
    # template covers all clients — the rule takes an `or` union across the
    # supported ELs, filtered by the `execution_client` label at scrape.
    metrics:
      # Head-of-chain block number the EL has fully imported and executed.
      headBlock: chain_head_block
      # Head-of-chain header number the EL has downloaded (may be ahead of
      # headBlock during snap sync while state is being healed).
      headHeader: chain_head_header
      # Connected peer count.
      peers: p2p_peers
  # Reth adapter. Genesis format is Geth-compatible (same digest-verified
  # genesis.json). State lives under /data/db/ (rethInitCommand asserts this
  # marker directory). No `--syncmode` — Reth's pipelined-staged sync is
  # always full-derivation. Image pin is the ghcr.io/paradigmxyz/reth v1.6.0
  # manifest digest resolved 2026-08-04.
  reth:
    image: ghcr.io/paradigmxyz/reth:v1.6.0@sha256:5b283f65853d32b240c8f639939bd6f9a8c6918b6dfc3148d0ba97e57d7f8da4
    # Optional temporary diagnostic filter. Keep empty in the base chart so
    # normal workloads retain the image's default logging level.
    logFilter: ""
    # Reth's native metric names differ from Geth's. Names below are the
    # gauges Reth exposes on --metrics; verify against the running Pod's
    # /metrics output before treating dashboard series as ground truth.
    #
    # `headHeader` is deliberately omitted for Reth. Reth's staged pipeline
    # does not surface a downloaded-header-frontier gauge distinct from the
    # canonical-chain height, and mapping both concepts to the same series
    # would publish `internal_sync_distance = 0` for Reth pairs regardless
    # of actual sync state — worse than empty telemetry because it looks
    # healthy. Per the PRD §12.5 contract, missing client telemetry is
    # unsupported/not collected, not zero. The `validator_platform_
    # execution_head_header` and `validator_platform_execution_internal_
    # sync_distance` recording rules therefore skip Reth in their unions.
    metrics:
      headBlock: reth_blockchain_tree_canonical_chain_height
      peers: reth_network_connected_peers
  # Erigon adapter. Genesis format is Geth-compatible (same digest-verified
  # genesis.json). State lives under /data/chaindata/ (erigonInitCommand
  # asserts this marker directory). No `--syncmode` — Erigon 3.x uses its
  # staged-sync pipeline unconditionally, architecturally different from
  # both Geth's snap sync and Reth's staged pipeline. Image digest was
  # resolved from Docker Hub's tags API for `erigontech/erigon:v3.5.4` on
  # 2026-08-04; verify with `docker buildx imagetools inspect
  # docker.io/erigontech/erigon:v3.5.4` against a live registry before the
  # first Erigon Pod starts.
  erigon:
    image: erigontech/erigon:v3.5.4@sha256:7d48b74edda1cc8b66909ba53cb8250f1225140dd915475d09521d95a3eb6fc7
    # Erigon's native metric names differ from both Geth's and Reth's.
    # Runtime observation on the Ephemery-162 pair confirmed `sync`, split
    # by a `stage` label, reports the current block for every main pipeline
    # stage while `p2p_peers` reports the connected peer count. The recording
    # rule's max aggregation drops `stage` and selects the current highest
    # stage. `headHeader` is deliberately omitted: Erigon's staged
    # pipeline does not publish a separately-observed downloaded-header-
    # frontier gauge distinct from the executed head, so mapping both
    # concepts to the same series would publish `internal_sync_distance = 0`
    # regardless of actual sync state. Per PRD §12.5, missing telemetry is
    # unsupported/not collected, not zero.
    metrics:
      # Executed head block number.
      headBlock: sync
      # Connected peer count.
      peers: p2p_peers
  # Besu adapter. Hyperledger's Java EL from Consensys — natural pair for
  # Teku (both Consensys/JVM). Genesis format is Geth-compatible (same
  # digest-verified genesis.json). State lives under /data/database/
  # (besuInitCommand asserts this marker directory; Besu creates it
  # implicitly during first run when --genesis-file is supplied — there is
  # no separate `besu init` subcommand, so the init helper preemptively
  # creates the marker directory for restart idempotence). Image digest was
  # resolved from Docker Hub's tags API for `hyperledger/besu:26.7.1` on
  # 2026-08-05; verify with `docker buildx imagetools inspect
  # docker.io/hyperledger/besu:26.7.1` against a live registry before the
  # first Besu Pod starts.
  besu:
    image: hyperledger/besu:26.7.1@sha256:5c319f8f5f3449438c03ea7fa2c9bf24b866dc55ac98d802bb41ad793e740587
    # Besu's native Prometheus metric names differ from the other ELs.
    # Runtime-observed on the active Ephemery Besu 26.7.1 Pod: the `/metrics`
    # endpoint publishes both names below. The recording rules degrade to
    # empty series for unknown names rather than render errors (matching the
    # pattern PR #96/#124 formalized). `headHeader`
    # deliberately omitted for the same PRD §12.5 reason as Reth/Erigon:
    # Besu does not publish a separately-observed downloaded-header
    # frontier gauge distinct from executed head.
    metrics:
      # Executed head block number.
      headBlock: ethereum_blockchain_height
      # Connected peer count.
      peers: ethereum_peer_count
  # Nethermind adapter. .NET-based EL from the Nethermind team. Ephemery
  # ships a Nethermind-format chainspec (chainspec.json) generated by
  # ethpandaops/ethereum-genesis-generator; the adapter consumes that
  # file via --Init.ChainSpecPath rather than the geth-style genesis.json
  # every other EL reads. With --Init.BaseDbPath=/data, state databases live
  # directly under /data; nethermindInitCommand uses the runtime-observed
  # /data/metadata directory as its initialized-data sentinel. The chart
  # runs Nethermind with --config=none so no built-in profile is
  # selected, and --KeyStore.KeyStoreDirectory is pinned into the PVC
  # because the default /nethermind/keystore/node.key.plain path fails
  # under the chart's read-only-root Pod contract. Image index digest
  # runtime-verified by Codex on 2026-08-05 against
  # docker.io/nethermind/nethermind:1.39.2 (multi-arch index).
  nethermind:
    image: nethermind/nethermind:1.39.2@sha256:25b9837f3113147eccf0d8bea6f1ae4d4d499301490cc71bd95afcc87b439757
    # Runtime-observed on the active Ephemery Nethermind 1.39.2 Pod:
    # `/metrics` publishes both names below. `nethermind_sync_peers` is
    # also present, but it is partitioned by remote-client type; the
    # aggregate `ethereum_peer_count` is the correct platform peer gauge.
    # `nethermind_peers` is absent. `headHeader` is deliberately omitted:
    # Nethermind does not publish a separately-observed downloaded-header
    # frontier gauge distinct from executed head.
    metrics:
      # Executed head block number.
      headBlock: nethermind_blocks
      # Connected peer count.
      peers: ethereum_peer_count
consensusClients:
  lighthouse:
    image: sigp/lighthouse:v8.2.1@sha256:9538f53d8e11766e3cb5de1889b292074f8e518e0dabe6df13d9054d504d1d62
    # Native Prometheus metric names Lighthouse exposes on --metrics-port.
    # The PrometheusRule aggregates these into `validator_platform_consensus_*`
    # via the same or-union pattern as the EL side; a second CL adapter
    # (Teku, Nimbus) provides its own map.
    metrics:
      # Current head slot on the beacon chain.
      headSlot: beacon_head_state_slot
      # Wall-clock present slot from slotclock.
      presentSlot: slotclock_present_slot
      # Wall-clock present epoch from slotclock.
      presentEpoch: slotclock_present_epoch
      # Finalized epoch of the beacon head.
      finalizedEpoch: beacon_head_state_finalized_epoch
      # Peer count metric. Lighthouse exposes per-status peer counts that
      # the rule sums; other CLs may use a single gauge (metric shape is
      # per-CL; the rule uses each map's peers name inside `sum`).
      peers: sync_peers_per_status
      # Enabled validator keys in Lighthouse's separate validator client.
      validatorEnabled: vc_validators_enabled_count
  # Teku adapter. Same generation-pinned consensus config as Lighthouse
  # (--network=<file>) and same bootnodes text. Image digest and metric
  # names verified against Consensys sources on 2026-08-04: digest
  # `sha256:5ab492…` resolves from Docker Hub's tags API for
  # `consensys/teku:26.7.1` with an amd64 manifest present; the five
  # metric names below match Teku's published metric/alert examples.
  teku:
    image: consensys/teku:26.7.1@sha256:5ab492b125c0fbcd60e7b3c32a7b61578a5e7186ed6637c077651795b133fb7b
    # Native Prometheus metric names Teku exposes on --metrics-port.
    metrics:
      # Current head slot on the beacon chain.
      headSlot: beacon_head_slot
      # Wall-clock present slot.
      presentSlot: beacon_slot
      # Wall-clock present epoch.
      presentEpoch: beacon_epoch
      # Finalized epoch of the beacon head.
      finalizedEpoch: beacon_finalized_epoch
      # Teku exposes libp2p connected-peer count under `libp2p_peers` on
      # its beacon-node /metrics endpoint (not the Prysm-style
      # `beacon_peer_count`).
      peers: libp2p_peers
      # Enabled public keys in Teku's separate validator client. Verified by
      # launching this exact digest with the hardened Pod UID/GID, the same
      # remote-signer flags, and an unreachable signer endpoint so the
      # contract process could not sign.
      validatorEnabled: validator_local_validator_count
  # Nimbus adapter. Written in Nim and specifically designed for low-resource
  # / embedded hardware; brings a fundamentally different implementation
  # strategy compared to Lighthouse (Rust) and Teku (Java). Loads the
  # generation-pinned Ephemery `config.yaml` via `--network=<dir>` where the
  # directory contains config.yaml + the other consensus artifacts. Data
  # lives under /data (`--data-dir`). Metric names are best-effort per
  # Nimbus documented Prometheus series; the recording rules degrade to
  # empty series for unknown names (no render error) matching the
  # runtime-verify pattern PR #96/#124 established. Image digest was
  # resolved from Docker Hub's tags API for `statusim/nimbus-eth2:multiarch-
  # v26.7.0` on 2026-08-05; verify with `docker buildx imagetools inspect
  # docker.io/statusim/nimbus-eth2:multiarch-v26.7.0` against a live
  # registry before the first Nimbus Pod starts.
  nimbus:
    image: statusim/nimbus-eth2:multiarch-v26.7.0@sha256:366be2cd8869b5dad45c3a8852e0476d78d675be4e7a10ab403f733b336cb9c6
    metrics:
      # Current head slot on the beacon chain.
      headSlot: beacon_head_slot
      # Wall-clock present slot.
      presentSlot: beacon_slot
      # Wall-clock present epoch.
      presentEpoch: beacon_current_epoch
      # Finalized epoch of the beacon head.
      finalizedEpoch: beacon_finalized_epoch
      # Peer count gauge (Nimbus uses libp2p, same shape as Teku).
      peers: libp2p_peers
  # Prysm adapter. Written in Go by Prysmatic Labs. Prysm cannot consume the
  # generic Ephemery config.yaml directly — it rejects `EPHEMERY_RESET_PERIOD`
  # and `NUMBER_OF_COLUMNS` and then inherits a mainnet Gloas fork-version
  # collision — so the chart's prysm consensus container derives
  # `/tmp/prysm-config.yaml` pre-exec from the bundle's `config.yaml`
  # (strip the two rejected keys, append `GLOAS_FORK_VERSION` /
  # `GLOAS_FORK_EPOCH`, fail on unexpected source shape). Runs after
  # `set -eu`, before `exec /beacon-chain`; the bundle SHA has already
  # been verified by the network-artifact-loader init container. Prysm's Prometheus surface exposes `beacon_head_slot`,
  # `beacon_clock_time_slot`, `beacon_finalized_epoch`, and
  # `connected_libp2p_peers`; it does NOT publish a direct present-epoch
  # gauge, so we declare `presentEpochDivisor: 32` and the recording rules
  # compute the derived epoch as `floor(beacon_clock_time_slot / 32)`.
  # Runtime-verified by Codex against Prysm v7.1.8 on 2026-08-05 (image
  # entrypoint `/beacon-chain`, UID/GID 1000, cap-drop ALL, read-only root,
  # tmpfs /tmp + /data mounts). Verify with `docker buildx imagetools inspect
  # gcr.io/prysmaticlabs/prysm/beacon-chain:v7.1.8` before the first Prysm
  # Pod starts on this network.
  prysm:
    image: gcr.io/prysmaticlabs/prysm/beacon-chain:v7.1.8@sha256:31239807cbbd446aabe8e7d18e0cd50c430a290ce7906b55eb5d54c7d4e3b676
    metrics:
      # Current head slot on the beacon chain.
      headSlot: beacon_head_slot
      # Wall-clock present slot (Prysm exposes only the clock-time slot, not
      # a separately-observed present-epoch counter).
      presentSlot: beacon_clock_time_slot
      # Number of slots per epoch; the recording rules compute the derived
      # present-epoch as `floor(presentSlot / presentEpochDivisor)`.
      # Ethereum uses 32 slots/epoch across all networks the chart supports.
      presentEpochDivisor: 32
      # Finalized epoch of the beacon head.
      finalizedEpoch: beacon_finalized_epoch
      # Peer count gauge — Prysm reports this under `connected_libp2p_peers`
      # (distinct from the Teku/Nimbus `libp2p_peers` naming).
      peers: connected_libp2p_peers

resources:
  execution:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "6"
      memory: 24Gi
  consensus:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "4"
      memory: 16Gi

nodeSelector:
  workload: ethereum

scheduling:
  # A preference preserves an on-demand recovery path while selecting Spot
  # whenever the EKS lab has both capacity types available. The required
  # workload label and taint/toleration remain the hard isolation boundary.
  preferSpot: false

# A single node pair cannot become highly available through a PDB. Environment
# profiles may disable its voluntary-disruption guard and shorten shutdown to
# fit an interruption exercise; the safer persistent-network defaults remain.
availability:
  nodeTerminationGracePeriodSeconds: 300
  validatorTerminationGracePeriodSeconds: 60
  nodeDisruptionBudgetEnabled: true
  validatorDisruptionBudgetEnabled: true

tolerations:
  - key: dedicated
    operator: Equal
    value: ethereum
    effect: NoSchedule

monitoring:
  enabled: true
