apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
  labels:
    platform.galaxy-lab/environment: dev
spec:
  dependsOn:
    - name: signer-prerequisites
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/apps/dev
  prune: true
  wait: true
  # This layer owns the shared signer application, not node-pair releases.
  # The RDS credential, TLS path, schema migration, generation-pinned network
  # config, and one encrypted validator key were qualified before activation.
  suspend: false
  commonMetadata:
    labels:
      platform.galaxy-lab/environment: dev
