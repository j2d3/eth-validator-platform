# Reuse the same generated, pinned Flux v2.8.8 controller bundle as local and
# patch only the cluster sync path. Authentication is a trusted-local read-only
# deploy-key bootstrap; no credential is represented here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../local/flux-system

patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./clusters/dev
