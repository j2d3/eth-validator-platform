apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-apps
  namespace: flux-system
  labels:
    platform.galaxy-lab/environment: dev
spec:
  dependsOn:
    # The selected public P2P Service names the AWS LBC loadBalancerClass.
    # Keep controller readiness as a direct dependency even though the apps
    # chain also reaches infrastructure-controllers transitively.
    - name: infrastructure-controllers
    - name: apps
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/apps/nodes/dev
  prune: true
  wait: true
  # The signing assignment is admitted only after the shared signer application
  # and its transitive RDS/migration/secret prerequisites report Ready.
  suspend: false
  commonMetadata:
    labels:
      platform.galaxy-lab/environment: dev
