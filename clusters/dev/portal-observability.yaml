apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal-observability
  namespace: flux-system
  labels:
    platform.galaxy-lab/environment: dev
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/apps/portal/dev
  prune: true
  wait: true
  commonMetadata:
    labels:
      platform.galaxy-lab/environment: dev
