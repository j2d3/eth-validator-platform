apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signer-infrastructure-configs
  namespace: flux-system
  labels:
    platform.galaxy-lab/environment: dev
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/infrastructure/configs/dev/signer
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: aws-secret-store-role-arns
        optional: false
  # The common node substrate reconciles with only the Engine reader input.
  # Resume this signer-only layer after RDS, scoped database/signing roles, and
  # both Pod security groups exist. Missing substitutions then fail closed.
  suspend: true
  commonMetadata:
    labels:
      platform.galaxy-lab/environment: dev
