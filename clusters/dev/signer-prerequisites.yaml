apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: signer-prerequisites
  namespace: flux-system
  labels:
    platform.galaxy-lab/environment: dev
spec:
  dependsOn:
    - name: signer-infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/apps/prerequisites/dev
  prune: true
  wait: true
  # The restricted RDS application credential and its branch-ENI path were
  # qualified separately; this stage admits only External Secrets and Flyway.
  suspend: false
  commonMetadata:
    labels:
      platform.galaxy-lab/environment: dev
