apiVersion: v1
kind: Namespace
metadata:
  name: network-policy-probe
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-policy-probe-server
  namespace: network-policy-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-policy-probe-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-policy-probe-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["sh", "-c"]
          args:
            - mkdir -p /tmp/www && printf 'network-policy-ok\n' >/tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: network-policy-probe
  namespace: network-policy-probe
spec:
  selector:
    app.kubernetes.io/name: network-policy-probe-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-policy-probe-allowed
  namespace: network-policy-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-policy-probe-client
      platform.galaxy-lab/network-policy-probe-access: allowed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-policy-probe-client
        platform.galaxy-lab/network-policy-probe-access: allowed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-policy-probe-denied
  namespace: network-policy-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-policy-probe-client
      platform.galaxy-lab/network-policy-probe-access: denied
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-policy-probe-client
        platform.galaxy-lab/network-policy-probe-access: denied
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-labeled-probe-client
  namespace: network-policy-probe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: network-policy-probe-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              platform.galaxy-lab/network-policy-probe-access: allowed
      ports:
        - port: 8080
          protocol: TCP
