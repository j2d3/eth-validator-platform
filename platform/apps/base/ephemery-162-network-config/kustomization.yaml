apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: web3signer-network-config-ephemery-162
    options:
      # The generation-specific name is referenced by both the shared signer
      # and the Lighthouse validator client; keep it stable across renders.
      disableNameSuffixHash: true
    files:
      - config.yaml=network-configs/ephemery-162.yaml
