apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: web3signer-network-config-ephemery-162
    options:
      # The generation-specific name is referenced by both the shared signer
      # and the Lighthouse validator client; keep it stable across renders.
      disableNameSuffixHash: true
    files:
      - config.yaml=network-configs/ephemery-162.yaml
      # Lighthouse v8.2.1 requires this file whenever --testnet-dir is used.
      # It comes from the same SHA-pinned Ephemery-162 bundle as config.yaml.
      - deposit_contract_block.txt=network-configs/deposit_contract_block.txt
