apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: web3signer
  namespace: signing
  labels:
    app.kubernetes.io/name: web3signer
    app.kubernetes.io/part-of: ethereum-validator-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web3signer
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      # Environment-independent half of the telemetry contract. cluster and
      # environment are environment-specific and are added by an overlay patch,
      # so this base stays portable across local and EKS.
      relabelings:
        - action: replace
          replacement: ethereum-validator
          targetLabel: platform
        - action: replace
          replacement: signer
          targetLabel: component
