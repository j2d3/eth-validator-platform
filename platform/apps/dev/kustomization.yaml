apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/web3signer
  - ../base/aws-rds-ca
  - ../base/ephemery-162-network-config
  - profile.yaml
  - validator-keystore-secret.yaml

patches:
  - path: signer-telemetry-patch.yaml
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: web3signer-database
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: aws-database-secrets
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: eth-validator-platform-dev/signing/web3signer-database
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: eth-validator-platform-dev/signing/web3signer-database
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: eth-validator-platform-dev/signing/web3signer-database
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: eth-validator-platform-dev/signing/web3signer-database
      - op: replace
        path: /spec/data/4/remoteRef/key
        value: eth-validator-platform-dev/signing/web3signer-database
      - op: replace
        path: /spec/data/2/remoteRef/property
        value: database
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web3signer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/11
        value: --slashing-protection-db-url=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=verify-full&sslrootcert=/var/run/aws-rds-ca/rds-ca.pem
      - op: replace
        path: /spec/template/spec/containers/0/args/9
        value: --network=/var/run/web3signer/network/config.yaml
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 999
      - op: add
        path: /spec/template/spec/securityContext/fsGroupChangePolicy
        value: OnRootMismatch
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/0/readOnly
        value: true
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: key-store
          secret:
            secretName: web3signer-validator-keystore
            defaultMode: 0440
            items:
              - key: validator.json
                path: validator.json
              - key: validator.password
                path: validator.password
              - key: validator.yaml
                path: validator.yaml
              - key: validator-02.json
                path: validator-02.json
              - key: validator-02.password
                path: validator-02.password
              - key: validator-02.yaml
                path: validator-02.yaml
              - key: validator-03.json
                path: validator-03.json
              - key: validator-03.password
                path: validator-03.password
              - key: validator-03.yaml
                path: validator-03.yaml
              - key: validator-04.json
                path: validator-04.json
              - key: validator-04.password
                path: validator-04.password
              - key: validator-04.yaml
                path: validator-04.yaml
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: aws-rds-ca
          mountPath: /var/run/aws-rds-ca
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: network-config
          mountPath: /var/run/web3signer/network
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: aws-rds-ca
          configMap:
            name: aws-rds-ca
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: network-config
          configMap:
            name: web3signer-network-config-ephemery-162
  - target:
      version: v1
      kind: ConfigMap
      name: aws-rds-ca
    patch: |-
      - op: add
        path: /metadata/namespace
        value: signing
  - target:
      version: v1
      kind: ConfigMap
      name: web3signer-network-config-ephemery-162
    patch: |-
      - op: add
        path: /metadata/namespace
        value: signing
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: web3signer
    patch: |-
      - op: replace
        path: /spec/egress/0
        value:
          to:
            - ipBlock:
                cidr: 10.42.0.0/16
          ports:
            - port: 5432
              protocol: TCP
labels:
  - pairs:
      platform.galaxy-lab/environment: dev
    includeSelectors: false
