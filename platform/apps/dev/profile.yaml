apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-profile
  namespace: ethereum
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
    platform.galaxy-lab/profile: platform-smoke
    platform.galaxy-lab/signing-enabled: "false"
data:
  environment: dev
  profile: platform-smoke
  network: hoodi
  signingEnabled: "false"
  explanation: "AWS platform adapter is declared; validator duties and signing are disabled."
