apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-profile
  namespace: ethereum
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
    platform.galaxy-lab/profile: platform-smoke
    platform.galaxy-lab/signing-enabled: "true"
data:
  environment: dev
  profile: platform-smoke
  network: ephemery-162
  signingEnabled: "true"
  explanation: "One deposited Ephemery validator uses the shared Web3Signer service and RDS slashing protection."
