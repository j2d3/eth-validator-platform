apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-platform-fleet-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ethereum-validator-platform
data:
  fleet-overview.json: |-
    {
      "annotations": {"list": []},
      "description": "Fleet and client-diversity overview built only on verified platform recording rules. Drill into a validator with the inventory table links; variables and time range carry across dashboards.",
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"type": "link", "title": "Validator detail", "url": "/d/eth-validator-detail", "icon": "external link", "tooltip": "Per-validator duty, pair and resource detail", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Pair detail", "url": "/d/eth-validator-geth-lighthouse", "icon": "external link", "tooltip": "Normalized pair health", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Logs", "url": "/d/eth-platform-logs", "icon": "external link", "tooltip": "Correlated Pod logs via Loki", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true}
      ],
      "panels": [
        {"type": "text", "title": "What this dashboard can and cannot show", "id": 1, "options": {"mode": "markdown", "content": "Every panel here is backed by a **platform recording rule that already exists** in `charts/ethereum-node/templates/prometheusrule.yaml`. No metric name on this dashboard is aspirational.\n\n`cluster` and `lifecycle` are genuine Prometheus labels, set by the pair chart scrape relabel contract and retained through every recording-rule aggregation — not Prometheus `externalLabels`, which apply on remote-write and federation rather than to locally queried series and so could not be selected on here.\n\nThose rules are only produced for assignments in the `active` lifecycle state with monitoring enabled. Under the default `platform-smoke` profile the pair is stopped, so **empty panels here are the correct and expected result** — they are not a collection failure. Once a pair is active, an empty panel *is* a defect.\n\n**Not collected today** — see the panel at the bottom of this dashboard before drawing conclusions from any absence."}, "gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}},
        {"type": "stat", "title": "Assignments reporting", "id": 2, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count(count by (assignment_id) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}))", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "no active assignments"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 0, "y": 5}},
        {"type": "stat", "title": "Targets up", "id": 3, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum(validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "text", "value": null}]}}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 6, "y": 5}},
        {"type": "stat", "title": "Targets down", "id": 4, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum(1 - validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 12, "y": 5}},
        {"type": "stat", "title": "Distinct client pairs", "id": 5, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count(count by (execution_client, consensus_client) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}))", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "no active assignments"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 18, "y": 5}},
        {"type": "table", "title": "Client diversity: assignments per execution/consensus pair", "id": 6, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (execution_client, consensus_client) (max by (execution_client, consensus_client, assignment_id) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}))", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "assignments"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10}},
        {"type": "timeseries", "title": "Execution client distribution over time", "id": 7, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (execution_client) (max by (execution_client, assignment_id) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}))", "legendFormat": "{{execution_client}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 8, "w": 6, "x": 12, "y": 10}},
        {"type": "timeseries", "title": "Consensus client distribution over time", "id": 8, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (consensus_client) (max by (consensus_client, assignment_id) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}))", "legendFormat": "{{consensus_client}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 8, "w": 6, "x": 18, "y": 10}},
        {"type": "table", "title": "Fleet inventory — one row per assignment; \"all targets up\" is 1 only when every component is up", "id": 9, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Component status is aggregated with min(), so a single down component drops the assignment row to 0. Per-component breakdown is on the validator detail dashboard.", "targets": [{"refId": "A", "expr": "min by (network, customer_id, validator_id, assignment_id, execution_client, consensus_client) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"})", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "all targets up"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped", "links": [{"title": "Validator detail for ${__data.fields.validator_id}", "url": "/d/eth-validator-detail?var-cluster=${cluster}&var-network=${__data.fields.network}&var-customer_id=${__data.fields.customer_id}&var-validator_id=${__data.fields.validator_id}&var-assignment_id=${__data.fields.assignment_id}&var-execution_client=${__data.fields.execution_client}&var-consensus_client=${__data.fields.consensus_client}&var-lifecycle=${lifecycle}&${__url_time_range}"}]}, "overrides": []}, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 18}},
        {"type": "table", "title": "Component targets — one row per component", "id": 11, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "The unaggregated view behind the inventory table above.", "targets": [{"refId": "A", "expr": "max by (validator_id, assignment_id, component) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"})", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "target up"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped"}, "overrides": []}, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 27}},
        {"type": "text", "title": "Not collected in this slice — read before inferring absence", "id": 10, "options": {"mode": "markdown", "content": "These dimensions are **deliberately absent**, not broken. Nothing on this dashboard maps them to zero.\n\n| Dimension | State | Why |\n|---|---|---|\n| Web3Signer / signing health | **Out of scope for this slice** | Deferred to its own reviewed slice rather than guessing at metric names. |\n| Duty success, attestation effectiveness, proposal outcomes | **No verified normalization** | Requires client metric semantics to be confirmed against the pinned images first. A recording rule is only added once those semantics are verified. |\n| Full validator public keys | **Never a metric label, by contract** | Public keys must not appear on broad infrastructure series. `validator_id` is the stable, safe identifier used throughout. |"}, "gridPos": {"h": 10, "w": 24, "x": 0, "y": 36}}
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["ethereum", "platform", "fleet", "overview"],
      "templating": {
        "list": [
          {"name": "cluster", "label": "Cluster", "type": "query", "description": "Real Prometheus label, set by the pair chart scrape relabel contract.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up, cluster)", "refId": "cluster"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "network", "label": "Network", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up, network)", "refId": "network"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "customer_id", "label": "Customer", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\"}, customer_id)", "refId": "customer_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "validator_id", "label": "Validator", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\"}, validator_id)", "refId": "validator_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "assignment_id", "label": "Assignment", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, assignment_id)", "refId": "assignment_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "execution_client", "label": "Execution client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, execution_client)", "refId": "execution_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "consensus_client", "label": "Consensus client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, consensus_client)", "refId": "consensus_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "lifecycle", "label": "Lifecycle", "type": "query", "description": "Real Prometheus label lifecycle_state, set by the pair chart scrape relabel contract. Also the Loki lifecycle_state label on the log dashboard.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{cluster=~\"$cluster\"}, lifecycle_state)", "refId": "lifecycle"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Ethereum Platform / Fleet",
      "uid": "eth-fleet-overview",
      "version": 1
    }
