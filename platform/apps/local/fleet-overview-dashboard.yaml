apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-platform-fleet-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ethereum-validator-platform
data:
  fleet-overview.json: |-
    {
      "annotations": {"list": []},
      "description": "Fleet and client-diversity overview built only on verified platform recording rules. Drill into a validator with the inventory table links; variables and time range carry across dashboards.",
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"type": "link", "title": "Validator detail", "url": "/d/eth-validator-detail", "icon": "external link", "tooltip": "Per-validator duty, pair and resource detail", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Pair detail (Geth + Lighthouse)", "url": "/d/eth-validator-geth-lighthouse", "icon": "external link", "tooltip": "Normalized pair health for the qualified client pair", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Logs", "url": "/d/eth-platform-logs", "icon": "external link", "tooltip": "Correlated Pod logs via Loki", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true}
      ],
      "panels": [
        {"type": "text", "title": "What this dashboard can and cannot show", "id": 1, "options": {"mode": "markdown", "content": "Every panel here is backed by a **platform recording rule that already exists** in `charts/ethereum-node/templates/prometheusrule.yaml`. No metric name on this dashboard is aspirational.\n\nThose rules are only produced for assignments in the `active` lifecycle state with monitoring enabled. Under the default `platform-smoke` profile the pair is stopped, so **empty panels here are the correct and expected result** — they are not a collection failure. Once a pair is active, an empty panel *is* a defect.\n\n**Not collected today** — see the panel at the bottom of this dashboard before drawing conclusions from any absence."}, "gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}},
        {"type": "stat", "title": "Assignments reporting", "id": 2, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count(count by (assignment_id) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"}))", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "no active assignments"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 0, "y": 5}},
        {"type": "stat", "title": "Targets up", "id": 3, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "text", "value": null}]}}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 6, "y": 5}},
        {"type": "stat", "title": "Targets down", "id": 4, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum(1 - validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"})", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 12, "y": 5}},
        {"type": "stat", "title": "Distinct client pairs", "id": 5, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count(count by (execution_client, consensus_client) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"}))", "instant": true}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "no active assignments"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 5, "w": 6, "x": 18, "y": 5}},
        {"type": "table", "title": "Client diversity: assignments per execution/consensus pair", "id": 6, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (execution_client, consensus_client) (max by (execution_client, consensus_client, assignment_id) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"}))", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "assignments"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10}},
        {"type": "timeseries", "title": "Execution client distribution over time", "id": 7, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (execution_client) (max by (execution_client, assignment_id) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"}))", "legendFormat": "{{execution_client}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 8, "w": 6, "x": 12, "y": 10}},
        {"type": "timeseries", "title": "Consensus client distribution over time", "id": 8, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "count by (consensus_client) (max by (consensus_client, assignment_id) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"}))", "legendFormat": "{{consensus_client}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 8, "w": 6, "x": 18, "y": 10}},
        {"type": "table", "title": "Fleet inventory — one row per assignment; \"all targets up\" is 1 only when every component is up", "id": 9, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Component status is aggregated with min(), so a single down component drops the assignment row to 0. Per-component breakdown is on the validator detail dashboard.", "targets": [{"refId": "A", "expr": "min by (network, customer_id, validator_id, assignment_id, execution_client, consensus_client) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"})", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "all targets up"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped", "links": [{"title": "Validator detail for ${__data.fields.validator_id}", "url": "/d/eth-validator-detail?var-cluster=${cluster}&var-network=${__data.fields.network}&var-customer_id=${__data.fields.customer_id}&var-validator_id=${__data.fields.validator_id}&var-assignment_id=${__data.fields.assignment_id}&var-execution_client=${__data.fields.execution_client}&var-consensus_client=${__data.fields.consensus_client}&var-lifecycle=${lifecycle}&${__url_time_range}"}]}, "overrides": []}, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 18}},
        {"type": "table", "title": "Component targets — one row per component", "id": 11, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "The unaggregated view behind the inventory table above.", "targets": [{"refId": "A", "expr": "max by (validator_id, assignment_id, component) (validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\"})", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}, "renameByName": {"Value": "target up"}}}], "fieldConfig": {"defaults": {"noValue": "no active assignments — expected while the pair profile is stopped"}, "overrides": []}, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 27}},
        {"type": "text", "title": "Not collected in this slice — read before inferring absence", "id": 10, "options": {"mode": "markdown", "content": "These dimensions are **deliberately absent**, not broken. Nothing on this dashboard maps them to zero.\n\n| Dimension | State | Why |\n|---|---|---|\n| `cluster` on metrics | **Not a Prometheus label** | `metricRelabelings` does not set it and no `externalLabels.cluster` is configured on the Prometheus spec. The `cluster` variable here is a documented constant so links to the log dashboard stay coherent; Alloy *does* set `cluster` on log streams, where it is a real query variable. Making it a real metric label is a monitoring-stack change, not a dashboard change. |\n| `lifecycle` on metrics | **Not a Prometheus label** | `platform.galaxy-lab/lifecycle` is a Kubernetes object label, and kube-state-metrics does not expose arbitrary Pod labels without an allowlist. It does not filter the metric panels above. It **does** filter the log dashboard, which defines a `lifecycle` variable bound to the Alloy-emitted `lifecycle_state` label, and the row links below carry it. |\n| Web3Signer / signing health | **Out of scope for this slice** | Deferred to its own reviewed slice rather than guessing at metric names. |\n| Per-assignment Kubernetes restarts and volume usage | **Cannot be correlated yet** | The chart renders `StatefulSet/ethereum-node-ethereum-node` and claims `ethereum-node-ethereum-node-{execution,consensus}`; the assignment appears only as an object label, never in the resource name. A correct join needs kube-state-metrics to expose those labels for both resource kinds via `metricLabelsAllowlist` — restarts key on the Pod and volume stats key on the PersistentVolumeClaim, so they are two different metric families joined on two different series, `kube_pod_labels` and `kube_persistentvolumeclaim_labels` respectively. Exposing only the Pod label would restore restarts and leave volume usage uncorrelated. A monitoring-stack change with its own runtime verification. |\n| Duty success, attestation effectiveness, proposal outcomes | **No verified normalization** | Requires client metric semantics to be confirmed against the pinned images first. A recording rule is only added once those semantics are verified. |\n| Full validator public keys | **Never a metric label, by contract** | Public keys must not appear on broad infrastructure series. `validator_id` is the stable, safe identifier used throughout. |"}, "gridPos": {"h": 10, "w": 24, "x": 0, "y": 36}}
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["ethereum", "platform", "fleet", "overview"],
      "templating": {
        "list": [
          {"name": "cluster", "label": "Cluster", "type": "textbox", "description": "Constant. Not a Prometheus label today; carried so log-dashboard links stay coherent with the Alloy static cluster label.", "query": "kind-eth-validator-local", "current": {"selected": false, "text": "kind-eth-validator-local", "value": "kind-eth-validator-local"}, "hide": 0},
          {"name": "network", "label": "Network", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up, network)", "refId": "network"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "customer_id", "label": "Customer", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\"}, customer_id)", "refId": "customer_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "validator_id", "label": "Validator", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\"}, validator_id)", "refId": "validator_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "assignment_id", "label": "Assignment", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, assignment_id)", "refId": "assignment_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "execution_client", "label": "Execution client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, execution_client)", "refId": "execution_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "consensus_client", "label": "Consensus client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, consensus_client)", "refId": "consensus_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "lifecycle", "label": "Lifecycle (logs only)", "type": "custom", "description": "Filters the log dashboard, where Alloy sets lifecycle_state. Not a Prometheus label, so it does not filter the metric panels on this dashboard.", "query": ".*,activating,active,failed-safe,stopping,stopped,archiving,archived,switching", "options": [], "current": {"selected": false, "text": ".*", "value": ".*"}, "includeAll": false, "multi": false}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Ethereum Platform / Fleet",
      "uid": "eth-fleet-overview",
      "version": 1
    }
