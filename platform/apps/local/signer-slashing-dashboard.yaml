apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-platform-signer-slashing-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ethereum-validator-platform
data:
  signer-slashing.json: |-
    {
      "annotations": {"list": []},
      "description": "Shared Web3Signer tier and its PostgreSQL slashing-protection database. Every metric name here was read from the pinned images rather than inferred.",
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"type": "link", "title": "Fleet overview", "url": "/d/eth-fleet-overview", "icon": "external link", "tooltip": "Fleet and client-diversity overview", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Validator detail", "url": "/d/eth-validator-detail", "icon": "external link", "tooltip": "Per-validator pair and resource detail", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Logs", "url": "/d/eth-platform-logs", "icon": "external link", "tooltip": "Signer audit and rejection log stream", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true}
      ],
      "panels": [
        {"type": "text", "title": "What this dashboard is reading", "id": 1, "options": {"mode": "markdown", "content": "Every Web3Signer metric below was read from the **pinned `consensys/web3signer:26.4.2` image's own `/metrics` endpoint**, and every database metric from the **pinned `cloudnative-pg` 0.29.0 `cnpg-default-monitoring` query set**. No metric name here is inferred.\n\n**Keys loaded is expected to be zero.** The platform is fail-closed: Web3Signer runs with an empty key store and cannot sign. A non-zero value on this lab is a finding, not progress.\n\n**Slashing counters are safety signals, not throughput.** `permitted` counts checks that reported safe-to-sign; `prevented` counts signings refused because they would have violated a slashing condition. Any increase in *prevented* deserves investigation even though it represents the protection working.\n\nThe signer tier is shared across all validators by design (PRD §10.4), so these are tier-level series and carry no per-validator identity."}, "gridPos": {"h": 7, "w": 24, "x": 0, "y": 0}},
        {"type": "stat", "title": "Signer up", "id": 2, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_signer_up{cluster=~\"$cluster\",environment=~\"$environment\"}", "legendFormat": "signer"}], "fieldConfig": {"defaults": {"noValue": "not collected", "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 0, "y": 7}},
        {"type": "stat", "title": "Keys loaded (must be 0 while fail-closed)", "id": 3, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_signer_keys_loaded{cluster=~\"$cluster\",environment=~\"$environment\"}", "legendFormat": "keys"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 6, "y": 7}},
        {"type": "stat", "title": "Slashing checks permitted (total)", "id": 4, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_signer_slashing_permitted_total{cluster=~\"$cluster\",environment=~\"$environment\"}", "legendFormat": "permitted"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 12, "y": 7}},
        {"type": "stat", "title": "Slashing signings PREVENTED (total)", "id": 5, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Any increase means a signing was refused because it would have violated a slashing condition. Investigate rather than celebrate.", "targets": [{"refId": "A", "expr": "validator_platform_signer_slashing_prevented_total{cluster=~\"$cluster\",environment=~\"$environment\"}", "legendFormat": "prevented"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 18, "y": 7}},
        {"type": "timeseries", "title": "Slashing check rate", "id": 6, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "rate(validator_platform_signer_slashing_permitted_total{cluster=~\"$cluster\",environment=~\"$environment\"}[$__rate_interval])", "legendFormat": "permitted/s"}, {"refId": "B", "expr": "rate(validator_platform_signer_slashing_prevented_total{cluster=~\"$cluster\",environment=~\"$environment\"}[$__rate_interval])", "legendFormat": "prevented/s"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 0, "y": 13}},
        {"type": "timeseries", "title": "Signing requests for unheld identities", "id": 7, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "signing_bls_missing_identifier_count_total — a request arrived for a key this signer does not hold.", "targets": [{"refId": "A", "expr": "rate(validator_platform_signer_missing_identifier_total{cluster=~\"$cluster\",environment=~\"$environment\"}[$__rate_interval])", "legendFormat": "missing identifier/s"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 12, "y": 13}},
        {"type": "text", "title": "Slashing-protection database", "id": 8, "options": {"mode": "markdown", "content": "The panels below read the **CloudNativePG** default monitoring queries, which observe the database itself. They do **not** observe the signer's connection to it — see the closing panel."}, "gridPos": {"h": 3, "w": 24, "x": 0, "y": 20}},
        {"type": "timeseries", "title": "Database connections by state", "id": 9, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum by (datname, state) (cnpg_backends_total{namespace=\"database\"})", "legendFormat": "{{datname}} / {{state}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 8, "x": 0, "y": 23}},
        {"type": "timeseries", "title": "Slashing database size", "id": 10, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "cnpg_pg_database_size_bytes{namespace=\"database\"}", "legendFormat": "{{datname}}"}], "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 8, "x": 8, "y": 23}},
        {"type": "timeseries", "title": "Transaction commit and rollback rate", "id": 11, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Slashing-protection writes are transactional; a sustained rollback rate is a correctness concern for signing safety.", "targets": [{"refId": "A", "expr": "rate(cnpg_pg_stat_database_xact_commit{namespace=\"database\"}[$__rate_interval])", "legendFormat": "{{datname}} commit/s"}, {"refId": "B", "expr": "rate(cnpg_pg_stat_database_xact_rollback{namespace=\"database\"}[$__rate_interval])", "legendFormat": "{{datname}} rollback/s"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 8, "x": 16, "y": 23}},
        {"type": "timeseries", "title": "Deadlocks and conflicts", "id": 12, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "rate(cnpg_pg_stat_database_deadlocks{namespace=\"database\"}[$__rate_interval])", "legendFormat": "{{datname}} deadlocks/s"}, {"refId": "B", "expr": "rate(cnpg_pg_stat_database_conflicts{namespace=\"database\"}[$__rate_interval])", "legendFormat": "{{datname}} conflicts/s"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 0, "y": 30}},
        {"type": "timeseries", "title": "Longest running transaction", "id": 13, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "max by (datname) (cnpg_backends_max_tx_duration_seconds{namespace=\"database\"})", "legendFormat": "{{datname}}"}], "fieldConfig": {"defaults": {"unit": "s", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 12, "y": 30}},
        {"type": "text", "title": "Not collected in this slice — read before inferring absence", "id": 14, "options": {"mode": "markdown", "content": "| Signal | State | Why |\n|---|---|---|\n| Signer-to-database connection health | **Not exposed by Web3Signer** | Verified by running the pinned `26.4.2` image twice — once with `--slashing-protection-enabled=false` and once enabled against a migrated PostgreSQL. Both runs exposed the **same 48 metric families**. There is no connection-pool, JDBC, or datasource metric; the only `pool` families are `jvm_buffer_pool_*`, `jvm_memory_pool_*` and `http_vertx_worker_pool_*`. Signer-side database health is therefore observable only through process liveness, the CloudNativePG panels above, and the signer log stream — not through a signer metric. Inventing one would have been worse than this gap. |\n| Per-validator signing attribution | **Not exposed** | Web3Signer's signing counters are unlabelled scalars with no key or identity dimension. That is also the safer design: a per-key label on a broad series is exactly the public-key cardinality the platform forbids. Per-validator attribution belongs to the validator client and the audit log. |\n| Slashing-protection row counts and low watermarks | **No verified query** | Would require a custom CloudNativePG query targeting the Web3Signer schema. Deferred until the query and its semantics are reviewed rather than guessed. |\n| `cnpg_collector_*` health series | **Not verified offline** | These come from the operator binary rather than the pinned chart artifacts, so they could not be confirmed from a pinned source and are deliberately unused. |\n| Signing latency percentiles | **Available but unused** | `signing_bls_signing_duration` is a summary and does exist. With signing disabled it has no samples, so a panel would be permanently empty; it belongs with the first real signing qualification. |\n\nThe pinned-image probe that produced these findings used throwaway containers with an empty key store, and both were removed. No key material existed at any point."}, "gridPos": {"h": 12, "w": 24, "x": 0, "y": 37}}
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["ethereum", "platform", "signer", "slashing"],
      "templating": {
        "list": [
          {"name": "cluster", "label": "Cluster", "type": "query", "description": "Real Prometheus label, set by the signer PodMonitor relabel contract.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_signer_up, cluster)", "refId": "cluster"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "environment", "label": "Environment", "type": "query", "description": "Real Prometheus label, set by the signer PodMonitor relabel contract.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_signer_up{cluster=~\"$cluster\"}, environment)", "refId": "environment"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Ethereum Platform / Signer and slashing protection",
      "uid": "eth-signer-slashing",
      "version": 1
    }
