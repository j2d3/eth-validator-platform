# Environment-specific half of the signer telemetry contract. The base
# PodMonitor sets platform and component, which are the same everywhere; cluster
# and environment are per-environment and are set here so the base stays
# portable to EKS. Mirrors the pair chart's telemetry values.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: web3signer
  namespace: signing
spec:
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      relabelings:
        - action: replace
          replacement: ethereum-validator
          targetLabel: platform
        - action: replace
          replacement: signer
          targetLabel: component
        - action: replace
          replacement: kind-eth-validator-local
          targetLabel: cluster
        - action: replace
          replacement: local
          targetLabel: environment
