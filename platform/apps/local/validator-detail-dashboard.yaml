apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-platform-validator-detail-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ethereum-validator-platform
data:
  validator-detail.json: |-
    {
      "annotations": {"list": []},
      "description": "Per-validator detail built only on the verified platform recording rules. Reached from the fleet inventory table; variables and time range carry back and forth.",
      "editable": false,
      "graphTooltip": 1,
      "links": [
        {"type": "link", "title": "Fleet overview", "url": "/d/eth-fleet-overview", "icon": "external link", "tooltip": "Fleet and client-diversity overview", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Pair detail", "url": "/d/eth-validator-geth-lighthouse", "icon": "external link", "tooltip": "Normalized pair health", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true},
        {"type": "link", "title": "Logs", "url": "/d/eth-platform-logs", "icon": "external link", "tooltip": "Correlated Pod logs via Loki", "targetBlank": false, "asDropdown": false, "includeVars": true, "keepTime": true}
      ],
      "panels": [
        {"type": "text", "title": "Scope of this view", "id": 1, "options": {"mode": "markdown", "content": "Identity, pair health, client process resource use, and Kubernetes restart and volume correlation for the selected validator, drawn from the eight `validator_platform_*` recording rules and from `kube_*` series joined on exposed identity labels.\n\nRecording rules exist only for assignments in the `active` lifecycle state. Under `platform-smoke` the pair is stopped, so **empty panels are expected here**. Once the pair is active, an empty panel is a defect worth investigating rather than a display quirk.\n\n`cluster` and `lifecycle` are now real Prometheus labels, set by the pair chart scrape relabel contract and retained through every recording-rule aggregation, so they filter these panels rather than only the log dashboard. Restart and volume panels correlate to the assignment through kube-state-metrics label joins on their own resource keys — never by matching a name substring.\n\nDuty outcomes, attestation effectiveness, and signer status are **not** on this dashboard — see the closing panel for why each is absent."}, "gridPos": {"h": 5, "w": 24, "x": 0, "y": 0}},
        {"type": "table", "title": "Identity", "id": 2, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "max by (network, customer_id, validator_id, assignment_id, execution_client, consensus_client) (validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"})", "format": "table", "instant": true}], "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true, "Value": true}}}], "fieldConfig": {"defaults": {"noValue": "no active assignment for this selection"}, "overrides": []}, "gridPos": {"h": 6, "w": 12, "x": 0, "y": 5}},
        {"type": "stat", "title": "Target up by component", "id": 3, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_pair_target_up{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{component}}"}], "fieldConfig": {"defaults": {"noValue": "not collected", "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 12, "y": 5}},
        {"type": "stat", "title": "Validator keys loaded", "id": 4, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_validator_enabled{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"], "values": false}}, "gridPos": {"h": 6, "w": 6, "x": 18, "y": 5}},
        {"type": "stat", "title": "Consensus slot lag", "id": 5, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_consensus_slot_lag{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}}"}], "fieldConfig": {"defaults": {"unit": "short", "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 3}]}}, "overrides": []}, "gridPos": {"h": 6, "w": 6, "x": 0, "y": 11}},
        {"type": "stat", "title": "Finality lag (epochs)", "id": 6, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_consensus_finality_lag_epochs{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}}"}], "fieldConfig": {"defaults": {"unit": "short", "noValue": "not collected", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 2}, {"color": "red", "value": 4}]}}, "overrides": []}, "gridPos": {"h": 6, "w": 6, "x": 6, "y": 11}},
        {"type": "timeseries", "title": "Peers", "id": 7, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_execution_peers{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}} / {{execution_client}}"}, {"refId": "B", "expr": "validator_platform_consensus_peers{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}} / {{consensus_client}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 6, "w": 12, "x": 12, "y": 11}},
        {"type": "timeseries", "title": "Process CPU by component", "id": 8, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_process_cpu_cores{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}} / {{component}}"}], "fieldConfig": {"defaults": {"unit": "cores", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 0, "y": 17}},
        {"type": "timeseries", "title": "Resident memory by component", "id": 9, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "validator_platform_process_resident_memory_bytes{cluster=~\"$cluster\",network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\",assignment_id=~\"$assignment_id\",execution_client=~\"$execution_client\",consensus_client=~\"$consensus_client\",lifecycle_state=~\"$lifecycle\"}", "legendFormat": "{{validator_id}} / {{component}}"}], "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 12, "y": 17}},
        {"type": "timeseries", "title": "Container restarts", "id": 11, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Joined to the assignment through kube_pod_labels on (namespace, pod). Requires the kube-state-metrics pods allowlist.", "targets": [{"refId": "A", "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"ethereum\"}[$__rate_interval]) * on (namespace, pod) group_left() kube_pod_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\",label_platform_galaxy_lab_validator_id=~\"$validator_id\"}", "legendFormat": "{{pod}} / {{container}}"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 0, "y": 24}},
        {"type": "timeseries", "title": "Persistent volume usage", "id": 12, "datasource": {"type": "prometheus", "uid": "prometheus"}, "description": "Joined to the assignment through kube_persistentvolumeclaim_labels on (namespace, persistentvolumeclaim) — a different resource key from the restart panel. Requires the kube-state-metrics persistentvolumeclaims allowlist.", "targets": [{"refId": "A", "expr": "kubelet_volume_stats_used_bytes{namespace=\"ethereum\"} * on (namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\",label_platform_galaxy_lab_validator_id=~\"$validator_id\"}", "legendFormat": "{{persistentvolumeclaim}} used"}, {"refId": "B", "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"ethereum\"} * on (namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\",label_platform_galaxy_lab_validator_id=~\"$validator_id\"}", "legendFormat": "{{persistentvolumeclaim}} capacity"}], "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "noValue": "not collected"}, "overrides": []}, "gridPos": {"h": 7, "w": 12, "x": 12, "y": 24}},
        {"type": "text", "title": "Not collected in this slice — read before inferring absence", "id": 13, "options": {"mode": "markdown", "content": "Absence below means **not yet collected or not yet verified**, never healthy-and-zero.\n\n| Signal | State | Why |\n|---|---|---|\n| Web3Signer status for this validator | **Out of scope for this slice** | Signer panels are deferred to their own reviewed slice rather than guessing at metric names. Signing is disabled and the key store is empty, so there is nothing to report yet regardless. |\n| Duty success / failure, attestation effectiveness, proposal outcomes | **No verified normalization** | These require confirming client metric semantics against the pinned images. A recording rule is added only once those semantics are verified — an unverified rule would produce a confident-looking wrong number, which is worse than an empty panel. |\n| Slashing-protection database state per validator | **Out of scope for this slice** | Belongs with the signer slice. |\n| Full validator public key | **Never a metric label, by contract** | Public keys must not appear on broad infrastructure series. `validator_id` is the stable, safe identifier. |"}, "gridPos": {"h": 11, "w": 24, "x": 0, "y": 31}}
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["ethereum", "platform", "validator", "detail"],
      "templating": {
        "list": [
          {"name": "cluster", "label": "Cluster", "type": "query", "description": "Real Prometheus label, set by the pair chart scrape relabel contract.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up, cluster)", "refId": "cluster"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "network", "label": "Network", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up, network)", "refId": "network"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "customer_id", "label": "Customer", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\"}, customer_id)", "refId": "customer_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "validator_id", "label": "Validator", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\"}, validator_id)", "refId": "validator_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "assignment_id", "label": "Assignment", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, assignment_id)", "refId": "assignment_id"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "execution_client", "label": "Execution client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, execution_client)", "refId": "execution_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "consensus_client", "label": "Consensus client", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{network=~\"$network\",customer_id=~\"$customer_id\",validator_id=~\"$validator_id\"}, consensus_client)", "refId": "consensus_client"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1},
          {"name": "lifecycle", "label": "Lifecycle", "type": "query", "description": "Real Prometheus label lifecycle_state, set by the pair chart scrape relabel contract. Also the Loki lifecycle_state label on the log dashboard.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": {"query": "label_values(validator_platform_pair_target_up{cluster=~\"$cluster\"}, lifecycle_state)", "refId": "lifecycle"}, "includeAll": true, "allValue": ".*", "multi": true, "refresh": 1}
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Ethereum Platform / Validator detail",
      "uid": "eth-validator-detail",
      "version": 1
    }
