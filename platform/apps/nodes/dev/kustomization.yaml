apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Eight generation-pinned Ephemery pairs are admitted in this EKS node
  # slice — Geth+Lighthouse, Reth+Lighthouse, Geth+Teku, and Reth+Teku
  # (signing), plus Erigon+Lighthouse, Geth+Nimbus, Besu+Teku, and
  # Nethermind+Lighthouse (non-signing). The generated catalog projection
  # remains the source; the overlay only deletes the local-only
  # synthetic-01 assignment and injects each pair's EKS-specific inputs
  # (valuesFiles + telemetry + engineJwt). Every Ephemery release below
  # must receive the same three patches so its ExternalSecret, PVC
  # StorageClass, and telemetry follow the reviewed dev contracts on EKS.
  - ../../local/assignments
  # The same generation-pinned consensus config is rendered separately into
  # the ethereum namespace for Lighthouse validator duties.
  - ../../base/ephemery-162-network-config
  - profile.yaml
  - sync-dashboard.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-synthetic-01
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: assignment-synthetic-01
        namespace: ethereum
      $patch: delete
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic
    patch: |-
      # Flux resolves HelmRelease.spec.chart.spec.valuesFiles relative to the
      # GitRepository artifact root (not the chart directory) when the chart
      # source is a GitRepository. The paths therefore include the chart
      # directory prefix. Verified against source-controller v1.8.5 in the dev
      # cluster on 2026-08-04: bare filenames produce
      # `no values file found at path '/values.yaml'` and the HelmChart stalls.
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
      # Exactly one pair owns the public P2P NLB. The other client-diversity
      # pairs retain ClusterIP P2P Services and sync through outbound peers.
      # loadBalancerClass assigns this Service to AWS LBC without mutating the
      # existing operations-ingress LoadBalancer into the same controller.
      - op: add
        path: /spec/values/p2p
        value:
          service:
            enabled: true
            # loadBalancerClass is immutable after Service creation. A new
            # suffix makes the controller migration a Helm delete/create
            # instead of an invalid in-place mutation of the failed legacy
            # -p2p Service.
            nameSuffix: p2p-nlb
            type: LoadBalancer
            loadBalancerClass: service.k8s.aws/nlb
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
              # Without this opt-in, AWS LBC collapses each same-number
              # TCP/UDP pair to its TCP member and silently omits discovery.
              service.beta.kubernetes.io/aws-load-balancer-enable-tcp-udp-listener: "true"
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
              service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: tcp
              service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "9000"
              service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
            externalTrafficPolicy: Cluster
            loadBalancerSourceRanges:
              - 0.0.0.0/0
  - target:
      version: v1
      kind: ConfigMap
      name: web3signer-network-config-ephemery-162
    patch: |-
      - op: add
        path: /metadata/namespace
        value: ethereum
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-reth
    patch: |-
      # Reth pair shares the same EKS-specific storage/scheduling/availability
      # profile as the Geth pair (values-eks-ephemery.yaml is EL-agnostic);
      # the chart dispatches on executionClient=reth from the projection.
      # Both pairs draw Engine JWT from the same Secrets Manager object —
      # the JWT authenticates the EL <-> CL Engine API and is per-pair
      # scoped by the chart's fullnameOverride (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-teku
    patch: |-
      # Teku pair uses the same EKS-specific storage/scheduling/availability
      # profile as the other Ephemery pairs (values-eks-ephemery.yaml is
      # CL-agnostic; the chart dispatches on consensusClient=teku from the
      # projection). Same Engine JWT source as Geth+Lighthouse and
      # Reth+Lighthouse — the JWT authenticates the EL <-> CL Engine API
      # and is per-pair scoped by the chart's fullnameOverride.
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-reth-teku
    patch: |-
      # Reth+Teku pair: both adapters already chart-supported from #93
      # (Reth EL) and #109 (Teku CL). The same values-eks-ephemery.yaml
      # profile is EL- and CL-agnostic; the chart dispatches on both
      # executionClient=reth and consensusClient=teku from the projection.
      # Same Engine JWT source as the other three Ephemery pairs — per-pair
      # scoped by fullnameOverride (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-geth-nimbus
    patch: |-
      # Geth+Nimbus pair: Nimbus CL adapter landed in #138 (uses
      # --external-beacon-api-url for checkpoint-adjacent BN wiring at
      # normal startup, --bootstrap-file pointed at consensusBootnodesText,
      # and --el for the EE endpoint). Same values-eks-ephemery.yaml
      # profile (EL/CL-agnostic; the chart dispatches on
      # consensusClient=nimbus from the projection). Same Engine JWT
      # source as the other Ephemery pairs — per-pair scoped by
      # fullnameOverride (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-besu-teku
    patch: |-
      # Besu+Teku pair: Besu EL adapter landed in #137, Teku CL adapter in
      # #109. Both were already chart-supported; this is a catalog-only
      # activation of the composition. First rendered release with two
      # JVM clients co-scheduled in one Pod (heap-sensitive process
      # colocation). Same values-eks-ephemery.yaml profile (EL/CL-agnostic;
      # the chart dispatches on both executionClient=besu and
      # consensusClient=teku from the projection). Same Engine JWT source
      # as the other Ephemery pairs — per-pair scoped by fullnameOverride
      # (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-erigon
    patch: |-
      # Erigon+Lighthouse pair: Erigon EL adapter landed in #131. Erigon 3.x
      # uses its own staged-sync pipeline — architecturally distinct from
      # Reth's staged pipeline and from Geth's snap. On this EKS profile
      # Geth is deliberately pinned to full sync (values-eks-ephemery.yaml)
      # to avoid the snap-pivot failure surface seen in the first restart
      # exercise, so the comparison is against three genuinely different
      # sync strategies at runtime. Same values-eks-ephemery.yaml profile
      # (EL/CL-agnostic; the chart dispatches on executionClient=erigon).
      # Same Engine JWT source — per-pair scoped by fullnameOverride
      # (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: assignment-ephemery-162-synthetic-nethermind-lighthouse
    patch: |-
      # Nethermind+Lighthouse pair: Nethermind EL adapter landed in #156.
      # Nethermind is .NET-based (fifth distinct EL runtime after Geth/Reth/
      # Erigon/Besu) and consumes the Ephemery-format `chainspec.json`
      # from the bundle via --Init.ChainSpecPath (not geth-style
      # genesis.json). Uses --config=none and pins
      # --KeyStore.KeyStoreDirectory=/data/keystore under the chart's
      # hardened Pod contract per Codex's runtime verification of 1.39.2.
      # Same values-eks-ephemery.yaml profile (EL-agnostic; the chart
      # dispatches on executionClient=nethermind from the projection).
      # Same Engine JWT source — per-pair scoped by fullnameOverride
      # (pair-<validator>-engine-jwt).
      - op: add
        path: /spec/chart/spec/valuesFiles
        value:
          - charts/ethereum-node/values.yaml
          - charts/ethereum-node/values-eks-ephemery.yaml
      - op: replace
        path: /spec/values/telemetry
        value:
          cluster: eth-validator-platform-dev
          environment: dev
      - op: add
        path: /spec/values/engineJwt
        value:
          secretStoreName: aws-engine-secrets
          remoteSecretKey: eth-validator-platform-dev/ethereum/engine-jwt
          remoteSecretProperty: jwt.hex

labels:
  - pairs:
      platform.galaxy-lab/environment: dev
    includeSelectors: false
