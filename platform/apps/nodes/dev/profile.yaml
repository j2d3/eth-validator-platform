apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-node-sync-profile
  namespace: ethereum
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
    platform.galaxy-lab/profile: ephemery-cold-standby
    platform.galaxy-lab/signing-enabled: "false"
data:
  environment: dev
  profile: ephemery-cold-standby
  network: ephemery-162
  signingEnabled: "false"
  explanation: "Cold standby: all Ephemery assignments are stopped and signing is disabled until a reviewed restore qualification."
