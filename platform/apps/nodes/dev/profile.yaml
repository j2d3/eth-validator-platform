apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-node-sync-profile
  namespace: ethereum
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
    platform.galaxy-lab/profile: ephemery-node-sync
    platform.galaxy-lab/signing-enabled: "true"
data:
  environment: dev
  profile: ephemery-validator
  network: ephemery-162
  signingEnabled: "true"
  explanation: "The Geth/Lighthouse pair runs one validator client through the shared Web3Signer service."
