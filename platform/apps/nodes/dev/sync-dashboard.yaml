apiVersion: v1
kind: ConfigMap
metadata:
  name: ethereum-platform-eks-ephemery-sync-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
data:
  eks-ephemery-sync.json: |-
    {
      "annotations": {"list": []},
      "description": "Ephemery client readiness, peers, head progress, chain lag, storage, and restarts on EKS.",
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {"type":"text","title":"Metric definitions","id":1,"options":{"mode":"markdown","content":"Kubernetes readiness reports whether the client API processes answer their probes. Sync status is represented separately by scrape status, peer counts, head progress, execution header/body distance, consensus slot lag, and finalized epoch progress.\n\n`validator_platform_execution_internal_sync_distance` is Geth's downloaded header minus executed block. Pair it with peer and head-progress series when reading sync state."},"gridPos":{"h":7,"w":24,"x":0,"y":0}},
        {"type":"stat","title":"Scrape targets up","id":2,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"min(validator_platform_pair_target_up{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"})","instant":true}],"fieldConfig":{"defaults":{"noValue":"not collected","mappings":[{"type":"value","options":{"0":{"text":"DOWN","color":"red"},"1":{"text":"UP","color":"green"}}}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"values":false}},"gridPos":{"h":5,"w":6,"x":0,"y":7}},
        {"type":"timeseries","title":"Execution and consensus peers","id":3,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_execution_peers{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"Geth"},{"refId":"B","expr":"validator_platform_consensus_peers{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"Lighthouse"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":7,"w":9,"x":6,"y":7}},
        {"type":"stat","title":"Geth internal sync distance","id":4,"description":"Verified Geth chain_head_header minus chain_head_block. This is not an independent network-tip distance.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_execution_internal_sync_distance{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","instant":true}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":1},{"color":"red","value":1024}]}},"overrides":[]},"options":{"colorMode":"background","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"],"values":false}},"gridPos":{"h":5,"w":9,"x":15,"y":7}},
        {"type":"timeseries","title":"Geth head and downloaded header","id":5,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_execution_head_block{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"executed block"},{"refId":"B","expr":"validator_platform_execution_head_header{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"downloaded header"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":0,"y":14}},
        {"type":"timeseries","title":"Lighthouse slot and finality lag","id":6,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_consensus_slot_lag{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"slot lag"},{"refId":"B","expr":"validator_platform_consensus_finality_lag_epochs{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"finality lag (epochs)"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":8,"w":12,"x":12,"y":14}},
        {"type":"timeseries","title":"Head changes during the trailing 15 minutes","id":7,"description":"A zero value means the observed head did not move. Pair it with peers and lag; progress alone is not a sync-complete claim.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_execution_head_changes_15m{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"Geth block changes"},{"refId":"B","expr":"validator_platform_consensus_head_changes_15m{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","legendFormat":"Lighthouse slot changes"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":7,"w":12,"x":0,"y":22}},
        {"type":"timeseries","title":"Persistent volume usage","id":8,"description":"Joined to the assignment through controlled PVC labels; stopped retains bound chain volumes and their cost.","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"kubelet_volume_stats_used_bytes{namespace=\"ethereum\"} * on (namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\"}","legendFormat":"{{persistentvolumeclaim}} used"},{"refId":"B","expr":"kubelet_volume_stats_capacity_bytes{namespace=\"ethereum\"} * on (namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\"}","legendFormat":"{{persistentvolumeclaim}} capacity"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":7,"w":12,"x":12,"y":22}},
        {"type":"timeseries","title":"Container restarts","id":9,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"increase(kube_pod_container_status_restarts_total{namespace=\"ethereum\"}[$__rate_interval]) * on (namespace, pod) group_left() kube_pod_labels{label_platform_galaxy_lab_assignment_id=~\"$assignment_id\"}","legendFormat":"{{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"noValue":"not collected"},"overrides":[]},"gridPos":{"h":7,"w":12,"x":0,"y":29}},
        {"type":"table","title":"Rendered identity and component status","id":10,"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"validator_platform_pair_target_up{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\",assignment_id=~\"$assignment_id\",lifecycle_state=~\"$lifecycle\"}","format":"table","instant":true}],"transformations":[{"id":"labelsToFields","options":{}}],"fieldConfig":{"defaults":{"noValue":"not collected"},"overrides":[]},"gridPos":{"h":7,"w":12,"x":12,"y":29}}
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["ethereum", "eks", "ephemery", "sync"],
      "templating": {"list": [
        {"name":"cluster","label":"Cluster","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(validator_platform_pair_target_up, cluster)","refId":"cluster"},"includeAll":true,"allValue":".*","multi":true,"refresh":1},
        {"name":"network_profile","label":"Network profile","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(validator_platform_pair_target_up{cluster=~\"$cluster\"}, network_profile)","refId":"network_profile"},"includeAll":true,"allValue":".*","multi":true,"refresh":1},
        {"name":"network_generation","label":"Generation","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(validator_platform_pair_target_up{cluster=~\"$cluster\",network_profile=~\"$network_profile\"}, network_generation)","refId":"network_generation"},"includeAll":true,"allValue":".*","multi":true,"refresh":1},
        {"name":"assignment_id","label":"Assignment","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(validator_platform_pair_target_up{cluster=~\"$cluster\",network_profile=~\"$network_profile\",network_generation=~\"$network_generation\"}, assignment_id)","refId":"assignment_id"},"includeAll":true,"allValue":".*","multi":true,"refresh":1},
        {"name":"lifecycle","label":"Lifecycle","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":{"query":"label_values(validator_platform_pair_target_up{cluster=~\"$cluster\",assignment_id=~\"$assignment_id\"}, lifecycle_state)","refId":"lifecycle"},"includeAll":true,"allValue":".*","multi":true,"refresh":1}
      ]},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Ethereum Platform / EKS Ephemery sync evidence",
      "uid": "eth-eks-ephemery-sync",
      "version": 1
    }
