apiVersion: batch/v1
kind: Job
metadata:
  name: web3signer-schema-v12
  namespace: database
  labels:
    app.kubernetes.io/name: web3signer-schema
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: ethereum-validator-platform
    app.kubernetes.io/version: "12"
    platform.galaxy-lab/environment: local
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    platform.galaxy-lab/migration-source: >-
      consensys/web3signer:26.4.2 /opt/web3signer/migrations/postgresql
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web3signer-schema
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: ethereum-validator-platform
        app.kubernetes.io/version: "12"
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-web3signer-migrations
          image: consensys/web3signer:26.4.2@sha256:9a20e02a5821ad72fd318fa2a3ec0158a9a5acd9db80aa9214e9cc991ad4dbc3
          imagePullPolicy: IfNotPresent
          command: ["/bin/cp"]
          args:
            - -a
            - /opt/web3signer/migrations/postgresql/.
            - /work/migrations/
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /work/migrations
      containers:
        - name: flyway
          image: flyway/flyway:13.0.0-alpine@sha256:f3c8433401abf859ef9022584c8e6111684363ec490f737e749e9a4705ea32d0
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: web3signer-postgres-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: web3signer-postgres-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: web3signer-postgres-app
                  key: dbname
            - name: FLYWAY_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=require
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: web3signer-postgres-app
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web3signer-postgres-app
                  key: password
            - name: FLYWAY_LOCATIONS
              value: filesystem:/work/migrations
            - name: FLYWAY_CONNECT_RETRIES
              value: "60"
            - name: FLYWAY_VALIDATE_MIGRATION_NAMING
              value: "true"
            - name: FLYWAY_CLEAN_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /work/migrations
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
