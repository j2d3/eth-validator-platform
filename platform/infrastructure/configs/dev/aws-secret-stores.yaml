# The Terraform-managed External Secrets Pod Identity role is a broker only. It
# may assume these scoped reader roles, but it must not read a secret directly.
# Flux substitutes the non-secret role ARNs from the trusted-local
# `aws-secret-store-role-arns` ConfigMap before applying this layer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-engine-secrets
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/aws-auth: eks-pod-identity
spec:
  conditions:
    - namespaces:
        - ethereum
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      role: ${EXTERNAL_SECRETS_ENGINE_READER_ROLE_ARN}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-database-secrets
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/aws-auth: eks-pod-identity
spec:
  conditions:
    - namespaces:
        - database
        - signing
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      role: ${EXTERNAL_SECRETS_DATABASE_READER_ROLE_ARN}
