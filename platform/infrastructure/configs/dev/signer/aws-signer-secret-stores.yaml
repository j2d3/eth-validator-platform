# These stores belong to the signer branch, not the node-only sync branch. The
# External Secrets Pod Identity role is a broker and may assume only the
# secret-scoped reader role selected by each store after the signer foundation
# has been applied.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-database-secrets
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/aws-auth: eks-pod-identity
spec:
  conditions:
    - namespaces:
        - database
        - signing
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      role: ${EXTERNAL_SECRETS_DATABASE_READER_ROLE_ARN}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-signing-secrets
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/aws-auth: eks-pod-identity
spec:
  conditions:
    - namespaces:
        - signing
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      role: ${EXTERNAL_SECRETS_SIGNING_READER_ROLE_ARN}
