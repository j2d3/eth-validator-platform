# The Terraform RDS foundation admits only this Pod security group. Flux
# substitutes its non-secret ID only after the signer branch is explicitly
# resumed; node-only sync never needs this value.
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: web3signer
  namespace: signing
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web3signer
  securityGroups:
    groupIds:
      - ${WEB3SIGNER_POD_SECURITY_GROUP_ID}
