apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-platform-secrets
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          platform.galaxy-lab/secret-consumer: permitted
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: local-secret-reader
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-database-secrets
spec:
  conditions:
    - namespaces:
        - signing
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: local-secret-reader
          namespace: external-secrets
