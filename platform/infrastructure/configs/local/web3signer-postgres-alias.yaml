apiVersion: v1
kind: Service
metadata:
  name: web3signer-postgres-rw
  namespace: signing
  labels:
    app.kubernetes.io/name: web3signer-postgres-alias
    app.kubernetes.io/component: database-adapter
    app.kubernetes.io/part-of: ethereum-validator-platform
    platform.galaxy-lab/environment: local
  annotations:
    platform.galaxy-lab/description: >-
      Resolves the namespace-local host generated by CloudNativePG to its
      database namespace service
spec:
  type: ExternalName
  externalName: web3signer-postgres-rw.database.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
