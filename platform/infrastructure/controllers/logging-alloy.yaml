apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
spec:
  dependsOn:
    - name: loki
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: alloy
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      create: false
    global:
      podSecurityContext:
        fsGroup: 473
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 473
        runAsNonRoot: true
        runAsUser: 473
        seccompProfile:
          type: RuntimeDefault
    image:
      digest: sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    alloy:
      enableReporting: false
      storagePath: /var/lib/alloy
      configMap:
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"

            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_network"]
              target_label  = "network"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_customer_id"]
              target_label  = "customer_id"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_validator_id"]
              target_label  = "validator_id"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_assignment_id"]
              target_label  = "assignment_id"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_execution_client"]
              target_label  = "execution_client"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_consensus_client"]
              target_label  = "consensus_client"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_component"]
              target_label  = "component"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_platform_galaxy_lab_lifecycle"]
              target_label  = "lifecycle_state"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            stage.static_labels {
              values = {
                cluster     = "kind-eth-validator-local",
                environment = "local",
                platform    = "ethereum-validator",
              }
            }

            forward_to = [loki.write.local.receiver]
          }

          loki.write "local" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
      mounts:
        varlog: false
        dockercontainers: false
        extra:
          - name: alloy-storage
            mountPath: /var/lib/alloy
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
    configReloader:
      enabled: false
    controller:
      type: daemonset
      minReadySeconds: 5
      volumes:
        extra:
          - name: alloy-storage
            emptyDir: {}
    rbac:
      create: true
      rules:
        - apiGroups:
            - ""
          resources:
            - namespaces
            - pods
            - pods/log
          verbs:
            - get
            - list
            - watch
      clusterRules:
        - apiGroups:
            - ""
          resources:
            - nodes
          verbs:
            - get
            - list
            - watch
    serviceMonitor:
      enabled: true
      interval: 30s
    networkPolicy:
      enabled: false
