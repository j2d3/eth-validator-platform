apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/part-of: ethereum-validator-platform
spec:
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 7.2.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      enableServiceLinks: false
      image:
        digest: sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
      podSecurityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        max_query_lookback: 24h
        retention_period: 24h
      compactor:
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        enableStatefulSetAutoDeletePVC: false
        size: 5Gi
        whenDeleted: Retain
        whenScaled: Retain
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
      extraEnv:
        - name: GOMEMLIMIT
          value: 900MiB
    lokiCanary:
      enabled: true
      image:
        digest: sha256:9ea589c612c3b01f2f9c3de3fa898f0476b3ba14526950ba4fe8906f50a6af81
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    test:
      enabled: false
    serviceAccount:
      automountServiceAccountToken: false
    rbac:
      namespaced: true
    monitoring:
      dashboards:
        enabled: true
        namespace: observability
      serviceMonitor:
        enabled: true
      rules:
        enabled: false
    sidecar:
      rules:
        enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
