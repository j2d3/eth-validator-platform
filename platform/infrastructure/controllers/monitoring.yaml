apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 86.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: monitoring
    defaultRules:
      # The upstream rule treats an intentionally retained OnDelete revision
      # as a failed rollout. Ethereum pairs use OnDelete so a chart update
      # cannot restart a syncing or signing node without an explicit lifecycle
      # action. Re-create the rule below for every other namespace.
      disabled:
        KubeStatefulSetUpdateNotRolledOut: true
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
    additionalPrometheusRulesMap:
      statefulset-rollout:
        groups:
          - name: statefulset-rollout
            rules:
              - alert: KubeStatefulSetUpdateNotRolledOut
                annotations:
                  description: >-
                    StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}
                    update has not been rolled out.
                  runbook_url: >-
                    https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetupdatenotrolledout
                  summary: StatefulSet update has not been rolled out.
                expr: |-
                  (
                    max by (namespace, statefulset, job, cluster) (
                      kube_statefulset_status_current_revision{
                        job="kube-state-metrics", namespace!="ethereum"
                      }
                      unless
                      kube_statefulset_status_update_revision{
                        job="kube-state-metrics", namespace!="ethereum"
                      }
                    )
                    * on (namespace, statefulset, job, cluster)
                    (
                      kube_statefulset_replicas{
                        job="kube-state-metrics", namespace!="ethereum"
                      }
                      !=
                      kube_statefulset_status_replicas_updated{
                        job="kube-state-metrics", namespace!="ethereum"
                      }
                    )
                  )
                  and on (namespace, statefulset, job, cluster)
                  (
                    changes(
                      kube_statefulset_status_replicas_updated{
                        job="kube-state-metrics", namespace!="ethereum"
                      }[5m]
                    ) == 0
                  )
                for: 15m
                labels:
                  severity: warning
      ethereum-pvc-capacity:
        groups:
          - name: ethereum-pvc-capacity
            interval: 30s
            rules:
              # kubelet volume metrics identify claims only by namespace and
              # PVC name. Normalize the allowlisted catalog labels from
              # kube-state-metrics once, then join every storage signal to the
              # platform assignment without relying on generated name
              # substrings.
              - record: validator_platform_pvc_identity
                expr: |-
                  max by (
                    namespace,
                    persistentvolumeclaim,
                    network,
                    network_profile,
                    network_generation,
                    customer_id,
                    validator_id,
                    assignment_id,
                    execution_client,
                    consensus_client,
                    lifecycle_state
                  ) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            label_replace(
                              label_replace(
                                label_replace(
                                  label_replace(
                                    label_replace(
                                      kube_persistentvolumeclaim_labels{
                                        namespace="ethereum",
                                        label_platform_galaxy_lab_assignment_id!=""
                                      },
                                      "network", "$1",
                                      "label_platform_galaxy_lab_network", "(.+)"
                                    ),
                                    "execution_client", "$1",
                                    "label_platform_galaxy_lab_execution_client", "(.+)"
                                  ),
                                  "consensus_client", "$1",
                                  "label_platform_galaxy_lab_consensus_client", "(.+)"
                                ),
                                "lifecycle_state", "$1",
                                "label_platform_galaxy_lab_lifecycle", "(.+)"
                              ),
                              "network_profile", "$1",
                              "label_platform_galaxy_lab_network_profile", "(.+)"
                            ),
                            "network_generation", "$1",
                            "label_platform_galaxy_lab_network_generation", "(.+)"
                          ),
                          "customer_id", "$1",
                          "label_platform_galaxy_lab_customer_id", "(.+)"
                        ),
                        "validator_id", "$1",
                        "label_platform_galaxy_lab_validator_id", "(.+)"
                      ),
                      "assignment_id", "$1",
                      "label_platform_galaxy_lab_assignment_id", "(.+)"
                    )
                  )
                labels:
                  cluster: kind-eth-validator-local
                  environment: local
              - record: validator_platform_pvc_used_bytes
                expr: |-
                  max by (namespace, persistentvolumeclaim) (
                    kubelet_volume_stats_used_bytes{namespace="ethereum"}
                  )
                  * on (namespace, persistentvolumeclaim)
                    group_left(
                      cluster,
                      environment,
                      network,
                      network_profile,
                      network_generation,
                      customer_id,
                      validator_id,
                      assignment_id,
                      execution_client,
                      consensus_client,
                      lifecycle_state
                    )
                    validator_platform_pvc_identity
              - record: validator_platform_pvc_capacity_bytes
                expr: |-
                  max by (namespace, persistentvolumeclaim) (
                    kubelet_volume_stats_capacity_bytes{namespace="ethereum"}
                  )
                  * on (namespace, persistentvolumeclaim)
                    group_left(
                      cluster,
                      environment,
                      network,
                      network_profile,
                      network_generation,
                      customer_id,
                      validator_id,
                      assignment_id,
                      execution_client,
                      consensus_client,
                      lifecycle_state
                    )
                    validator_platform_pvc_identity
              - record: validator_platform_pvc_utilization_ratio
                expr: |-
                  validator_platform_pvc_used_bytes
                  /
                  clamp_min(validator_platform_pvc_capacity_bytes, 1)
              # A projection is withheld until the recording rule existed
              # five hours ago. This keeps a handful of startup samples from
              # becoming a confident-looking forecast. Negative slopes are
              # clamped to zero.
              - record: validator_platform_pvc_growth_bytes_per_second
                expr: |-
                  clamp_min(
                    deriv(validator_platform_pvc_used_bytes[6h]),
                    0
                  )
                  and on (
                    cluster,
                    environment,
                    namespace,
                    persistentvolumeclaim,
                    network,
                    network_profile,
                    network_generation,
                    customer_id,
                    validator_id,
                    assignment_id,
                    execution_client,
                    consensus_client,
                    lifecycle_state
                  )
                  (
                    present_over_time(
                      validator_platform_pvc_used_bytes[5m] offset 5h
                    ) == 1
                  )
              - record: validator_platform_pvc_projected_seconds_to_full
                expr: |-
                  clamp_min(
                    validator_platform_pvc_capacity_bytes
                    - validator_platform_pvc_used_bytes,
                    0
                  )
                  /
                  clamp_min(
                    validator_platform_pvc_growth_bytes_per_second,
                    1
                  )
                  and on (
                    cluster,
                    environment,
                    namespace,
                    persistentvolumeclaim,
                    network,
                    network_profile,
                    network_generation,
                    customer_id,
                    validator_id,
                    assignment_id,
                    execution_client,
                    consensus_client,
                    lifecycle_state
                  )
                  (
                    validator_platform_pvc_growth_bytes_per_second > 1024
                  )
              - alert: EthereumPersistentVolumeUtilizationHigh
                annotations:
                  description: >-
                    PersistentVolumeClaim {{ $labels.namespace }}/{{
                    $labels.persistentvolumeclaim }} for assignment {{
                    $labels.assignment_id }} has exceeded 85% utilization for
                    30 minutes.
                  runbook_url: >-
                    https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md#persistent-volume-capacity
                  summary: Ethereum client persistent volume utilization is high.
                expr: validator_platform_pvc_utilization_ratio > 0.85
                for: 30m
                labels:
                  category: storage
                  severity: warning
              - alert: EthereumPersistentVolumeProjectedFull
                annotations:
                  description: >-
                    PersistentVolumeClaim {{ $labels.namespace }}/{{
                    $labels.persistentvolumeclaim }} for assignment {{
                    $labels.assignment_id }} is projected to fill within seven
                    days after at least five hours of recorded history.
                  runbook_url: >-
                    https://github.com/j2d3/eth-validator-platform/blob/main/docs/runbooks/ethereum-alerts.md#persistent-volume-capacity
                  summary: Ethereum client persistent volume is projected to fill.
                expr: validator_platform_pvc_projected_seconds_to_full < 604800
                for: 30m
                labels:
                  category: storage
                  severity: warning
    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.observability.svc.cluster.local:3100
          isDefault: false
          jsonData:
            maxLines: 1000
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          searchNamespace: ALL
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          memory: 512Mi
    alertmanager:
      alertmanagerSpec:
        retention: 24h
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 256Mi
    prometheus:
      prometheusSpec:
        retention: 24h
        retentionSize: 8GB
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 2Gi
    prometheus-node-exporter:
      hostRootFsMount:
        enabled: false
    # Expose only the identity labels required to join Kubernetes resource
    # metrics back to a platform assignment. The node-group label separates
    # always-on system capacity from paused/resumed Ethereum capacity; restarts
    # key on the Pod and volume stats key on the PersistentVolumeClaim.
    # Deliberately
    # omits platform.galaxy-lab/public-key and every other high-cardinality or
    # sensitive label — kube_*_labels series are broad, and a public key must
    # never appear on one. Rendered by the pinned chart as
    # --metric-labels-allowlist=nodes=[...],pods=[...],persistentvolumeclaims=[...].
    kube-state-metrics:
      metricLabelsAllowlist:
        - nodes=[eks.amazonaws.com/nodegroup]
        - pods=[platform.galaxy-lab/network,platform.galaxy-lab/network-profile,platform.galaxy-lab/network-generation,platform.galaxy-lab/customer-id,platform.galaxy-lab/validator-id,platform.galaxy-lab/assignment-id,platform.galaxy-lab/execution-client,platform.galaxy-lab/consensus-client,platform.galaxy-lab/component]
        - persistentvolumeclaims=[platform.galaxy-lab/network,platform.galaxy-lab/network-profile,platform.galaxy-lab/network-generation,platform.galaxy-lab/customer-id,platform.galaxy-lab/validator-id,platform.galaxy-lab/assignment-id,platform.galaxy-lab/execution-client,platform.galaxy-lab/consensus-client,platform.galaxy-lab/lifecycle]
