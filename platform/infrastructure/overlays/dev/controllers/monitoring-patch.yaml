apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  values:
    grafana:
      # The local Loki/Alloy topology is intentionally not claimed as an EKS
      # logging design. Add an AWS logging adapter after retention, object
      # storage, and ingestion cost have been reviewed.
      additionalDataSources: []
      grafana.ini:
        server:
          root_url: https://ops.g.j2d3.com/grafana
          serve_from_sub_path: true
        # Anonymous read access for the demo. This is a non-financial
        # Ethereum testnet lab; nothing under this datasource is secret.
        # The Viewer role is not a per-dashboard grant — OSS Grafana lets
        # a Viewer issue arbitrary PromQL against every organization
        # datasource, so this configuration exposes the full cluster
        # Prometheus query surface to unauthenticated callers, not only
        # the pre-built panels. Accepted as a deliberate demo tradeoff and
        # documented in docs/runbooks/operations-ingress.md. Writes remain
        # gated by the admin login (dashboard edits, datasource changes,
        # plugin install). A production instance would front Grafana with
        # OIDC/SSO and a query-scoped datasource instead.
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Viewer
          hide_version: true
        security:
          cookie_secure: true
          cookie_samesite: lax
          disable_gravatar: true
